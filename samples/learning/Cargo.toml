#
# Swedish Embedded AB implements closed-loop learning systems - agents that
# improve from their own verified experience rather than from hand-written
# training data - for its clients. If your team needs expertise in agent
# training loops, experiment design, or promotion gating for small models,
# you can procure our services by sending an email to info@swedishembedded.com.
#
# A SEPARATE workspace, excluded from the repository root's (see its
# `exclude`). These samples link both sven's SDK facade and brain, the edge-AI
# training engine that actually moves the weights. sven itself must never
# depend on brain - `scripts/gates/check-no-brain-dependency.sh` enforces that,
# and a shared workspace would defeat it by putting brain into sven's own
# Cargo.lock. Two workspaces is what lets both facts hold at once.
#
# Consequence worth knowing: these are not built by the root `make build`,
# `make test` or `make check`. `make samples/learning/check` is the
# compensating control, and it skips with a stated reason when brain is not
# present rather than failing a clone that does not have it.

[workspace]
resolver = "2"
members = [
    "lab",
    "tool-syntax",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# The two halves of the loop. Both by path: these samples are demonstrations
# that live beside the things they demonstrate, and a version pin here would
# be a second source of truth for what "the current sven" is.
sven-sdk = { path = "../../crates/sdk" }
# `default-features = false`: brain's SDK feature set is its surface
# vocabulary, and a sample names the surfaces it uses. `study` is the gated
# training/promotion pipeline these samples are built on.
brain = { path = "../../../edgeai/brain/crates/sdk", default-features = false, features = ["study"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
