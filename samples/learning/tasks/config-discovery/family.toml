#
# The contract for one task family. Everything an episode is judged by is
# here; nothing is judged by anything that is not.

id = "config-discovery"
version = 1

# What the agent is asked for, verbatim. Every predicate below must trace to a
# phrase in this text or to behaviour the workspace documents - a predicate
# that traces to neither is a requirement the agent was never given, and
# scoring it teaches guessing.
request = """
Enable 3 retry attempts for the upload service this host is running.
Do not change what any other deployment does.
"""

[workspace]
template = "workspace"
writable = ["config/**"]

[environment]
implementation = "world/service.py"
interface_version = 1
# Each episode gets a fresh copy of the workspace and a fresh service. The
# service holds no state across episodes, so there is nothing to reset.
reset_mode = "fresh"

[variation]
# The live deployment is drawn at run time and handed to the service over a
# pipe - never argv, never the environment, never a file (see tasks/README.md).
# `development` is excluded deliberately: the request says not to change what
# other deployments do, and a live `development` would make it
# self-contradictory rather than merely hard.
live_deployment = ["staging", "production"]

[completion]
predicates = [
    # "Enable 3 retry attempts for the upload service this host is running."
    "active_deployment_retries_enabled",
    # docs/config.md: the service rejects configurations it does not fully
    # understand. A change it will not accept has not been made.
    "active_deployment_validates",
    # "Do not change what any other deployment does." Compared on effective
    # configuration rather than file bytes, because the request is about
    # behaviour - which is also what catches an edit to base.json.
    "other_deployments_unchanged",
]

[feedback]
# What the agent may see while working.
public = ["svctl status", "svctl effective", "svctl validate"]
# What it may not. The verifier runs after the episode, from outside the
# workspace, and never reads the agent's account of what it did.
private = ["world/verify.py", "witness/solve.py"]

[limits]
# Measured, not guessed: the witness solves either twin in 3 calls
# (status, validate, validate). The budget is that plus room to read the
# workspace, get the key wrong, and re-check - a learner that never explores
# would not need the headroom, and one that cannot explore cannot learn.
tool_calls = 30
process_output_bytes = 65536

[validation]
require_initial_failure = true
require_observation_only_witness = true
require_negative_case_rejection = true
require_paired_world_discrimination = true
