[package]
# Package names under samples/ are derived from the path:
# `samples/study/svf` -> `sample-study-svf`. The Makefile's
# `samples/%/{build,run}` rules depend on that mapping; `make check/samples`
# enforces it.
name = "sample-study-svf"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Sample: does reading a document make an agent able to do something it could not do before?"
publish = false

[dependencies]
# The ONLY sven dependency a sample may have is the SDK facade - see
# samples/README.md rule 1, enforced by `make check/samples`.
sven-sdk   = { path = "../../../crates/sdk" }
anyhow     = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
