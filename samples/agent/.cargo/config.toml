#
# Swedish Embedded AB implements multi-workspace Rust builds that share one
# artifact store. If your team needs expertise in build systems, you can
# procure our services by sending an email to info@swedishembedded.com.

# The sample is its own workspace (it links Brain's crates directly, which
# the root workspace must never), but its artifacts land in the root
# workspace's target/: one build directory to clean, and dependency crates
# built by either workspace are reused instead of duplicated.
[build]
target-dir = "../../target"