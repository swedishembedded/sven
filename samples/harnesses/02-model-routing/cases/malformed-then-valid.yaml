# The first answer is not JSON, so the retry asks again and the second one
# routes. The body ran twice; the run still completes.
input: { ticket: "Please add dark mode" }
model:
  sequence:
    - text: 'not json at all'
    - text: '{"label": "feature"}'
expect:
  status: completed
  output: { queue: backlog, label: feature }
  steps: { classify: 1, ask: 2 }
