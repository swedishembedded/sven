# The model asks for write_notes, which neither the child's allowlist nor its
# declaration admits. The call is refused before it runs - the fixture records
# no invocation - and the agent carries on to an answer.
input: { question: "Fix the typo in the notes" }
model:
  sequence:
    - tool_calls: [ { id: c1, name: write_notes, args: { path: notes.md, content: "fixed" } } ]
    - text: "I can only read the notes."
tools:
  read_notes:
    capability: ReadFile
    responses: []
  write_notes:
    capability: WriteFile
    responses: []
expect:
  status: completed
  output: { answer: "I can only read the notes." }
  tools_invoked: []
  tools_not_invoked: [write_notes]
  forbidden_capabilities: [WriteFile]
