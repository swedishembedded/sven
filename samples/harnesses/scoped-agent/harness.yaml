# A parent that holds two capabilities and delegates reading to an imported
# workflow that holds one. Neither can write: the child's agent is also held to
# the tools it names.
api_version: "2"
name: triage
description: "Answer a question from the notes by delegating the reading to an imported workflow."
inputs: { question: string }
imports:
  reader: ./lib/reader.yaml
capabilities: [SpawnChild, ReadFile]
execution: { limits: { model_turns: 6, delegate_depth: 2 } }
workflow:
  - name: look_up
    use: reader
    with: { question: "{{ inputs.question }}" }
outputs:
  answer: { type: string, value: "{{ tasks.look_up.output.answer }}" }
