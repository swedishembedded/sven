# The child. It declares ReadFile and nothing else, and its agent step names
# the one tool it may call; a proposed call to anything else is refused before
# it runs.
api_version: "1"
name: reader
description: "Read the notes with read_notes and answer from them."
inputs: { question: string }
capabilities: [ReadFile]
limits: { max_steps: 10, max_model_turns: 4, max_tool_calls: 2 }
entry: read
steps:
  read: { agent: { prompt: "Answer from the notes, using read_notes: {{ inputs.question }}", tools: [read_notes], store_as: answer, then: done } }
  done: { return: { value: "{{ facts.answer }}" } }
