# The tool says "patched" but writes nothing. The retry is satisfied, and the
# independent verification is what catches it: the run fails as unrepaired.
input: {}
tools:
  write_patch:
    capability: WriteFile
    responses:
      - ok: "patched"
expect:
  status: failed
  failure: { code: unrepaired }
  steps: { patch: 1, check: 1, repaired: 0, unrepaired: 1 }
