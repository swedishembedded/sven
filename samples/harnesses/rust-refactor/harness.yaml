#
# Refactor a Rust repository file by file without changing what it does.
#
# explore finds out how the project is checked and what a refactorer must know,
# and the check must pass on the untouched tree. Then, for every tracked .rs
# file under `paths`, a fresh auditor (read-only) lists the problems, a fresh
# fixer fixes them, a fresh reviewer corrects the diff and writes the commit
# message, and the harness commits once the project's own check passes. A file
# that cannot be made to pass is reset and the sweep goes on. Agents never
# commit, so `git reset --hard HEAD` is always the way back.
#
# Swedish Embedded AB implements agent-driven refactoring of large Rust
# codebases that is judged by the build and the tests, not by the agent, for its
# clients. If your team needs expertise in behaviour-preserving refactoring at
# scale then you can procure our services by sending an email to
# info@swedishembedded.com.
api_version: "2"
name: rust-refactor
description: "Refactor a Rust repository file by file: audit, fix, review, commit - judged by the project's own check."
inputs:
  paths: { type: string, description: "space-separated git pathspecs to refactor, e.g. 'crates src'" }
  limit: { type: number, description: "refactor at most this many files" }
variables:
  context: { type: string, description: "what a refactorer of this repository must know" }
  check: { type: string, description: "one bash command, run at the repository root, that builds, tests, lints and format-checks the project and exits non-zero on any failure" }
  files: { type: json, description: "the files to refactor" }
  tests: { type: number, description: "how many tests the project had before any change" }
  findings: { type: string, scope: item, description: "the current file's problems, numbered, each with its fix" }
  commit_message: { type: string, scope: item, description: "the commit message for the current file's change" }
agent:
  profile: coding
  tools: [read_file, find_file, grep, edit_file, write_file, shell]
  turn: { max_output_tokens: 8192 }
  system: >-
    You are a senior Rust engineer in a git repository, your working directory. You make
    behaviour-preserving structural improvements only. Never commit, never change branches,
    and never touch anything outside the repository.
execution:
  workspace: repository
  resume: true
  limits: { model_turns: 100000, tool_calls: 1000000 }
gates:
  backlog:
    description: A clean tree, and the files to refactor.
    capture: files
    output_bytes: 1048576
    run: |
      test -z "$(git status --porcelain)" || { echo "commit or stash your changes first" >&2; exit 1; }
      git ls-files -- {{ inputs.paths }} | grep '\.rs$' | jq -Rnc '[inputs][:{{ inputs.limit }}]'
  baseline:
    description: The check passes on the untouched tree; count the tests.
    capture: tests
    timeout: 3600
    run: |
      ( {{ vars.check }} ) >&2
      cargo test --workspace --all-targets -- --list 2>/dev/null | grep -c ': test$' || true
  check:
    description: The check passes, no test is gone, and the change stays small.
    timeout: 3600
    run: |
      ( {{ vars.check }} ) >&2
      now=$(cargo test --workspace --all-targets -- --list 2>/dev/null | grep -c ': test$' || true)
      [ "$now" -ge "{{ vars.tests }}" ] || { echo "$now tests left of {{ vars.tests }}: never remove a test" >&2; exit 1; }
      changed=$(git status --porcelain | wc -l)
      [ "$changed" -le 12 ] || { git status --short >&2; echo "$changed files changed: fix this file, do not re-architect" >&2; exit 1; }
  commit:
    description: Commit the change, if there is one.
    run: |
      git add -A
      git diff --cached --quiet && exit 0
      subject=$(printf '%s\n' "$MSG" | head -n 1)
      [ "${#subject}" -le 72 ] || { git reset -q; echo "subject over 72 characters: $subject" >&2; exit 1; }
      printf '%s\n' "$MSG" | git commit -q -F -
    env: { MSG: "{{ vars.commit_message }}" }
  rollback:
    description: Throw the file's change away.
    run: git reset -q --hard HEAD && git clean -q -fd
workflow:
  - name: explore
    tools: [read_file, find_file, grep, shell]
    vars: { context: required, check: required }
    task: |
      Survey this Rust repository for engineers who will refactor it file by file. Only read;
      change nothing. Read selectively (grep, head, line ranges): the root Cargo.toml, the
      README, AGENTS.md / CONTRIBUTING, the Makefile or justfile, CI files, lint and format
      configuration, a few lib.rs files.

      Then set two variables with harness_vars_set:
      - `check`: one bash command that builds, tests, lints and format-checks the project the way
        its own Makefile or CI does, offline and non-interactive, e.g.
        `cargo build --workspace --all-targets && cargo test --workspace && cargo fmt --all -- --check`.
        Leave out a lint or format step the project does not pass today. Set it first.
      - `context`: at most about 1200 words of Markdown: purpose, layout and layering, the
        public surface a refactor must never change (APIs, CLI flags, file and wire formats),
        conventions, shared helpers worth reusing, and hazards.
    verify: [backlog, baseline]
    repair:
      attempts: 2
      prompt: |
        The check `{{ failure.gate }}` failed:
        {{ failure.stderr }}
        If `check` fails on the untouched tree, set a `check` that passes. Change no file.
  - name: files
    for_each:
      source: { variable: files }
      max_items: 10000
      on_item_failure: { verify: [rollback] }
    checkpoint: each_item
    do:
      - name: audit
        tools: [read_file, find_file, grep]
        vars: { context: read, findings: required }
        task: |
          {{ vars.context }}

          Audit `{{ item }}`. Read it in full, and whatever else you need to judge it (its
          callers, its tests). Find the problems a behaviour-preserving refactor can fix:
          duplication, functions that do too much, unclear names, stale comments, dead code,
          needless clones, unexplained unwraps, leaky visibility, code in the wrong module,
          departures from the repository's conventions. Skip anything whose fix would change
          behaviour or the public surface. Report only what you can point at.

          Set `findings`: a numbered list, each with the location, what is wrong, the fix and
          the other files it touches - or exactly "No changes needed.".
      - name: fix
        when: { ne: vars.findings, value: "No changes needed." }
        tools: [read_file, find_file, grep, edit_file, write_file, shell]
        vars: { context: read, check: read, findings: read }
        task: |
          {{ vars.context }}

          Fix these problems of `{{ item }}`, across every file they require, without changing
          what the program does:

          {{ vars.findings }}

          Keep behaviour, outputs, errors and the public surface exactly as they are; skip a fix
          that is not clearly safe. Update every use of anything you rename or move. Never
          delete or weaken a test. Then run `{{ vars.check }}` and fix what you broke.
      - name: review
        when: { ne: vars.findings, value: "No changes needed." }
        tools: [read_file, find_file, grep, edit_file, write_file, shell]
        vars: { context: read, check: read, findings: read, commit_message: required }
        task: |
          {{ vars.context }}

          Review the refactoring of `{{ item }}` (`git diff`); assume it has mistakes. Revert any
          hunk that changes behaviour, the public surface or a test; finish anything left half
          done; grep for uses of renamed items. Run `{{ vars.check }}` until it passes.

          Set `commit_message`: `<area>: <what changed>` (at most 72 characters), a blank line,
          and why the code is better with behaviour unchanged.
        verify: [check]
        repair:
          attempts: 2
          prompt: |
            The check failed:
            {{ failure.stderr }}
            Fix the cause (never a test) or revert the hunk that caused it.
      - name: commit
        verify: [commit]
success:
  work_items: { all_settled: true }
outputs:
  check: { type: string, value: "{{ vars.check }}" }
