# Two files: the first has a problem and goes through audit, repair, review
# and the executor's commit; the second is clean, so only its audit runs and
# nothing is committed. Every verdict is a gate.
input:
  paths: src
  max_files: 6
  max_items: 50
  tool_calls: 200
model:
  sequence:
  - tool_calls:
    - id: c1
      name: harness_vars_set
      args:
        name: context
        value: '## Purpose

          A tiny library.'
    - id: c2
      name: harness_vars_set
      args:
        name: checks
        value:
          build: cargo build --workspace --all-targets
          test: cargo test --workspace
          lint: ''
          format_check: cargo fmt --all -- --check
  - text: Done.
  - tool_calls:
    - id: v3
      name: harness_vars_set
      args:
        name: findings
        value: 1. `add` (lines 2-4) re-implements util::sum; call it.
  - text: Audited.
  - tool_calls:
    - id: v4
      name: harness_vars_set
      args:
        name: repair_summary
        value: 'src/lib.rs: add calls util::sum.'
  - text: Repaired.
  - tool_calls:
    - id: v5
      name: harness_vars_set
      args:
        name: commit_message
        value: 'lib: reuse util::sum in add


          One implementation of summing; behaviour is unchanged.'
  - text: Reviewed.
  - tool_calls:
    - id: v6
      name: harness_vars_set
      args:
        name: findings
        value: No changes needed.
  - text: Audited.
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: ''
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: '[{"file": "src/lib.rs"}, {"file": "src/util.rs"}]'
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: '12

          '
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: 'abc123

          '
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: ''
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: ''
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: ''
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: ''
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: '[main 1a2b3c] lib: reuse util::sum in add

          '
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: '1a2b3c

          '
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: 'nothing to commit

          '
        stderr: ''
expect:
  status: completed
  output:
    checks:
      build: cargo build --workspace --all-targets
      test: cargo test --workspace
      lint: ''
      format_check: cargo fmt --all -- --check
  steps:
    files__iter: 3
    audit__work: 2
    repair__work: 1
    review__work: 1
    commit__work: 2
