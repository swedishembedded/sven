# The first file's build stays red through both repair attempts: the item
# fails, the rollback gate puts the repository back to its base, and the
# sweep goes on with the second file.
input:
  paths: src
  max_files: 6
  max_items: 50
  tool_calls: 200
model:
  sequence:
  - tool_calls:
    - id: c1
      name: harness_vars_set
      args:
        name: context
        value: '## Purpose

          A tiny library.'
    - id: c2
      name: harness_vars_set
      args:
        name: checks
        value:
          build: cargo build --workspace --all-targets
          test: cargo test --workspace
          lint: ''
          format_check: cargo fmt --all -- --check
  - text: Done.
  - tool_calls:
    - id: v3
      name: harness_vars_set
      args:
        name: findings
        value: 1. Split `parse` (lines 10-80).
  - text: Audited.
  - tool_calls:
    - id: v4
      name: harness_vars_set
      args:
        name: repair_summary
        value: split parse
  - text: Repaired.
  - text: Tried again.
  - text: And again.
  - tool_calls:
    - id: v6
      name: harness_vars_set
      args:
        name: findings
        value: No changes needed.
  - text: Audited.
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: ''
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: '[{"file": "src/lib.rs"}, {"file": "src/util.rs"}]'
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: '12

          '
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: 'abc123

          '
        stderr: ''
    - ok:
        exit_code: 1
        timed_out: false
        error: null
        stdout: ''
        stderr: 'error[E0425]: cannot find value'
        failed_step: build
    - ok:
        exit_code: 1
        timed_out: false
        error: null
        stdout: ''
        stderr: error[E0425]
        failed_step: build
    - ok:
        exit_code: 1
        timed_out: false
        error: null
        stdout: ''
        stderr: error[E0425]
        failed_step: build
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: ''
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: 'abc123

          '
        stderr: ''
    - ok:
        exit_code: 0
        timed_out: false
        error: null
        stdout: 'nothing to commit

          '
        stderr: ''
expect:
  status: completed
  output:
    checks:
      build: cargo build --workspace --all-targets
      test: cargo test --workspace
      lint: ''
      format_check: cargo fmt --all -- --check
  steps:
    files__iter: 3
    repair__work: 1
    review__work: 0
