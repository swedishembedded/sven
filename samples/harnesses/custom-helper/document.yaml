# A sandboxed helper reshapes the input before a branch routes it. The helper
# is not in this file: it is a WASM module carried by bundle.yaml under the name
# `reshape`. bundle.yaml is generated from this file (see README.md); edit this
# one and regenerate.
api_version: "1"
name: custom-transform
description: "Reshape an order with a bundled helper, then route it."
inputs: { customer: string, urgent: boolean }
outputs: { queue: string, customer: string }
limits: { max_steps: 20, max_helper_fuel: 200000, max_helper_pages: 2 }
entry: prep
steps:
  prep:     { transform: { helper: reshape, input: { who: "{{ inputs.customer }}", urgent: "{{ inputs.urgent }}" }, store_as: shaped, then: route } }
  route:    { branch: { on: "facts.shaped.urgent", when_true: express, when_false: standard } }
  express:  { return: { value: { queue: express, customer: "{{ facts.shaped.who }}" } } }
  standard: { return: { value: { queue: standard, customer: "{{ facts.shaped.who }}" } } }
