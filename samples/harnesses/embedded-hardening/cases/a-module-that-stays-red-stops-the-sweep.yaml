# The agent says ringbuf is fixed, but its module test keeps failing. After
# the two repair attempts the run fails at that module with the check's name;
# the later modules stay pending and nothing advances.
input: {}
model:
  sequence:
  - tool_calls:
    - id: w-.hardening-toolchain.md
      name: write_file
      args: {path: .hardening/toolchain.md, content: x}
  - {text: toolchain documented}
  - tool_calls:
    - id: w-.hardening-backlog.json
      name: write_file
      args: {path: .hardening/backlog.json, content: x}
    - id: w-.hardening-plan.md
      name: write_file
      args: {path: .hardening/plan.md, content: x}
  - {text: planned}
  - {text: ringbuf fixed}
  - {text: tried again}
  - {text: tried a third time}
workspace:
  .hardening/run.sh: "#!/bin/sh\n# SPDX-License-Identifier: Apache-2.0\n# Copyright (c) 2026 Martin Schröder\
    \ <info@swedishembedded.com>\n#\n# build | test [module] | coverage | lint | layering, for the embedded\
    \ fixture.\n# The harness pins this file and .hardening/pins.sha256 by hash: they are the\n# check,\
    \ so the agent never edits them. `build` also verifies that the given\n# tests, which are the specification,\
    \ are the bytes in pins.sha256.\nset -u\ncd \"$(dirname \"$0\")/..\" || exit 2\nCFLAGS=\"-std=c99\
    \ -Wall -Wextra -Werror -Iinclude -Isrc -Ihal\"\nOUT=.hardening/out\nmkdir -p \"$OUT\"\nMODULES=\"\
    ringbuf crc8 uart_tx\"\n\nsources_of() {\n\tcase \"$1\" in\n\tuart_tx) echo \"src/uart_tx.c hal/hal_stub.c\"\
    \ ;;\n\t*) echo \"src/$1.c\" ;;\n\tesac\n}\n\n# A module's tests: the given tests/test_<m>.c and,\
    \ when the agent adds them,\n# tests/extra_<m>.c. Both must pass.\ntest_files() {\n\techo \"tests/test_$1.c\"\
    \n\t[ -f \"tests/extra_$1.c\" ] && echo \"tests/extra_$1.c\"\n}\n\nrun_tests() { # extra compiler\
    \ flags, then the modules\n\tflags=$1\n\tshift\n\tfailed=0\n\tfor m in \"$@\"; do\n\t\tfor t in $(test_files\
    \ \"$m\"); do\n\t\t\t# shellcheck disable=SC2086\n\t\t\tif ! cc $CFLAGS $flags -o \"$OUT/$(basename\
    \ \"$t\" .c)\" \"$t\" $(sources_of \"$m\"); then\n\t\t\t\techo \"test build failed: $t\"\n\t\t\t\t\
    failed=1\n\t\t\t\tcontinue\n\t\t\tfi\n\t\t\tif ! \"$OUT/$(basename \"$t\" .c)\"; then\n\t\t\t\techo\
    \ \"test failed: $t\"\n\t\t\t\tfailed=1\n\t\t\tfi\n\t\tdone\n\tdone\n\treturn $failed\n}\n\ncase \"\
    ${1:-}\" in\nbuild)\n\tsha256sum --quiet -c .hardening/pins.sha256 || { echo \"the given tests were\
    \ changed\"; exit 1; }\n\tfor m in $MODULES; do\n\t\tfor s in $(sources_of \"$m\"); do\n\t\t\tcc $CFLAGS\
    \ -c \"$s\" -o \"$OUT/$(basename \"$s\" .c).o\" || exit 1\n\t\tdone\n\tdone\n\t;;\ntest)\n\tshift\n\
    \tif [ $# -gt 0 ]; then run_tests \"\" \"$@\"; else run_tests \"\" $MODULES; fi\n\t;;\ncoverage)\n\
    \trm -rf \"$OUT/cov\" && mkdir -p \"$OUT/cov\"\n\tfor m in $MODULES; do\n\t\tfor t in $(test_files\
    \ \"$m\"); do\n\t\t\tb=$(basename \"$t\" .c)\n\t\t\t# shellcheck disable=SC2086\n\t\t\tcc $CFLAGS\
    \ --coverage -O0 -o \"$OUT/cov/$b\" \"$t\" $(sources_of \"$m\") || exit 1\n\t\t\t(cd \"$OUT/cov\"\
    \ && \"./$b\" >/dev/null 2>&1) || true\n\t\tdone\n\tdone\n\tpct=$(gcovr --root . --object-directory\
    \ \"$OUT/cov\" --filter 'src/' --json-summary 2>/dev/null |\n\t\tsed -n 's/.*\"line_percent\": *\\\
    ([0-9.]*\\).*/\\1/p' | head -1)\n\t[ -n \"$pct\" ] || { echo \"coverage: gcovr produced no figure\"\
    ; exit 1; }\n\tprintf '{\"line_pct\": %s}\\n' \"$pct\" > .hardening/coverage.json\n\t;;\nlint)\n\t\
    # shellcheck disable=SC2046\n\tclang-tidy --quiet --warnings-as-errors='*' \\\n\t\t--checks='-*,bugprone-*,clang-analyzer-*,-bugprone-easily-swappable-parameters'\
    \ \\\n\t\t$(ls src/*.c hal/*.c) -- $CFLAGS 2>&1\n\t;;\nlayering)\n\t# The HAL is reached from the\
    \ modules that drive hardware only: no public\n\t# header names it, and only uart_tx.c includes it.\n\
    \tbad=$( { grep -l 'hal\\.h' src/*.h; grep -l 'hal\\.h' src/*.c | grep -v '^src/uart_tx\\.c$'; } 2>/dev/null)\n\
    \tif [ -n \"$bad\" ]; then\n\t\techo \"layering: the HAL leaks into: $bad\"\n\t\texit 1\n\tfi\n\t\
    ;;\n*)\n\techo \"usage: run.sh build | test [module] | coverage | lint | layering\" >&2\n\texit 2\n\
    \t;;\nesac\n"
  .hardening/pins.sha256: "42f9e7db2d0fb21ab8fd5db082a3f15aab6be00b45ae7676c5350a167f054443  tests/test_crc8.c\n\
    0b5360ef3183ec1d22bb86d5528b7c7e65e227afecd8bf6ec02917fb50c3ab9f  tests/test_ringbuf.c\n4654d1e384359f701f4e5e0610309fc27ee1c415e0385796b1fa97c6eb2a1b8a\
    \  tests/test_uart_tx.c\ne24c11bf9fe7a7b43e510cf549d66aab6c1b493927c2258f7c48a629f64a52ea  tests/minitest.h\n"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
    - ok: {exit_code: 0, timed_out: false, error: null, stdout: ok, stderr: ''}
    - ok: {exit_code: 0, timed_out: false, error: null, stdout: ok, stderr: ''}
    - ok: {exit_code: 1, timed_out: false, error: null, stdout: 'FAIL tests/test_ringbuf.c:18: rb_push(&rb,
          99) == -1', stderr: ''}
    - ok: {exit_code: 0, timed_out: false, error: null, stdout: ok, stderr: ''}
    - ok: {exit_code: 1, timed_out: false, error: null, stdout: 'FAIL tests/test_ringbuf.c:18: rb_push(&rb,
          99) == -1', stderr: ''}
    - ok: {exit_code: 0, timed_out: false, error: null, stdout: ok, stderr: ''}
    - ok: {exit_code: 1, timed_out: false, error: null, stdout: 'FAIL tests/test_ringbuf.c:18: rb_push(&rb,
          99) == -1', stderr: ''}
  read_json_snapshot:
    capability: ReadFile
    responses:
    - ok:
        digest: d1
        value:
        - {module: ringbuf}
        - {module: crc8}
        - {module: uart_tx}
  digest_files:
    capability: ReadFile
    responses:
    - ok: {ringbuf: digest-ringbuf}
    - ok: {crc8: digest-crc8}
    - ok: {uart_tx: digest-uart_tx}
  write_file:
    capability: WriteFile
    responses:
    - ok: written
      write:
        path: .hardening/toolchain.md
        content: "cc -std=c99 -Wall -Wextra -Werror; run.sh has build, test, coverage, lint, layering;\
          \ the HAL host stand-in is hal/hal_stub.c.\n"
    - ok: written
      write: {path: .hardening/backlog.json, content: '{"items": [{"module": "ringbuf"}, {"module": "crc8"},
          {"module": "uart_tx"}]}'}
    - ok: written
      write:
        path: .hardening/plan.md
        content: "Only uart_tx may reach the HAL; fix ringbuf, crc8 and uart_tx in that order and keep\
          \ headers free of hal.h.\n"
  edit_file:
    capability: WriteFile
    responses:
    - ok: edited
      write:
        path: CHANGELOG.md
        content: "# Changelog\n\n## [Unreleased]\n\n- Fixed the ring buffer full check, the CRC-8 polynomial\
          \ and partial UART writes; added tests and kept the HAL out of public headers.\n"
expect:
  status: failed
  failure: {code: gate_failed, message_contains: module_test}
