# The search never returns. Cancelling the run stops the branch that is
# waiting on it - the case would fail with a leaked call if it did not.
input: { topic: "tide tables" }
model:
  rules:
    - { match_type: contains, pattern: "history:", reply: "Tide tables date from antiquity." }
    - { match_type: contains, pattern: "sources:", reply: "unused" }
tools:
  search_slow:
    capability: ReadFile
    responses:
      - block: true
bounds: { cancel_after_ms: 100 }
expect:
  status: cancelled
  tools_invoked: [search_slow]
