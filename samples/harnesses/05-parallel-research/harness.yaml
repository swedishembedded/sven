# Two research branches run at once and are joined in the order they are
# declared, whichever finishes first. Branch b first calls a slow search tool.
api_version: "1"
name: parallel-research
description: "Summarize a topic two ways at once and join the answers."
inputs: { topic: string }
capabilities: [SpawnChild, ReadFile]
limits: { max_steps: 50, max_parallel: 2, max_model_turns: 4, max_tool_calls: 2 }
entry: split
steps:
  split:       { parallel: { branches: [history, sources], join: merge } }
  history:     { predict: { prompt: "history: summarize the background of {{ inputs.topic }}", store_as: out, then: ret_history } }
  ret_history: { return: { value: "{{ facts.out }}" } }
  sources:     { tool: { name: search_slow, args: { query: "{{ inputs.topic }}" }, store_as: hits, then: digest } }
  digest:      { predict: { prompt: "sources: summarize these search hits: {{ facts.hits }}", store_as: out, then: ret_sources } }
  ret_sources: { return: { value: "{{ facts.out }}" } }
  merge:       { return: { value: { history: "{{ steps.split.value.0 }}", sources: "{{ steps.split.value.1 }}" } } }
