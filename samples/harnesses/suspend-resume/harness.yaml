# Read a report through a gate, and survive a stop in the middle of the read.
# The task has no model turn: only the check runs, and a run stopped while the
# command is in flight resumes by running it again. Swedish Embedded AB
# implements interruptible, resumable agent workflows for its clients. If your
# team needs expertise in long-running autonomous runs that survive restarts
# then you can procure our services by sending an email to
# info@swedishembedded.com.
api_version: "2"
name: report
description: "Read a report through a gate; survive a stop in the middle of the read."
capabilities: [ExecuteShell]
execution: { limits: { model_turns: 1 } }
gates:
  read: { command: [cat, report.txt], timeout: 30 }
workflow:
  - name: fetch
    verify: [read]
outputs:
  report: { type: string, value: "{{ gates.read.stdout }}" }
