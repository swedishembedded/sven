# The read blocks, the 300 ms deadline suspends the run with a checkpoint, and
# the checkpoint resumes under the same program: the interrupted read runs
# again, costing neither a repair attempt nor a second start of the step.
input: {}
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - block: true
bounds: { deadline_ms: 300 }
expect:
  status: suspended
  steps: { fetch__v0_read_a0: 1 }
resume:
  tools:
    shell_gate:
      capability: ExecuteShell
      responses:
        - ok: { exit_code: 0, timed_out: false, error: null, stdout: "all green", stderr: "" }
  expect:
    status: completed
    output: { report: "all green" }
    steps: { fetch__v0_read_a0: 1 }
    tools_invoked: [shell_gate]
