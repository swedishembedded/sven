# Without a bound the same program runs straight through: two failed reads
# spend the retry and the plan's own failure ends the run.
input: {}
tools:
  read_report:
    capability: ReadFile
    responses:
      - error: "locked"
      - error: "locked"
expect:
  status: failed
  failure: { code: stuck }
  steps: { call: 2, give_up: 1 }
