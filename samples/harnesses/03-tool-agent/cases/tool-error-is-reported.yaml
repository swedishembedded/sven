# A failing tool is not a failing run: the error goes back to the model,
# which reports it in its answer.
input: { question: "When is the deploy window?" }
model:
  sequence:
    - tool_calls: [ { id: c1, name: read_notes, args: { path: notes.md } } ]
    - text: "The notes could not be read: disk full."
tools:
  read_notes:
    capability: ReadFile
    responses:
      - error: "disk full"
expect:
  status: completed
  output: { answer: "The notes could not be read: disk full." }
  tools_invoked: [read_notes]
