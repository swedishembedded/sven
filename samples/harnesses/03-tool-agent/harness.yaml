# A parent that holds two capabilities and delegates reading to a child that
# holds one. Neither can write: the child's agent step is also held to the
# tools it names.
api_version: "1"
name: triage
description: "Answer a question from the notes by delegating the reading to a child harness."
inputs: { question: string }
outputs: { answer: string }
capabilities: [SpawnChild, ReadFile]
limits: { max_steps: 20, max_delegate_depth: 2 }
entry: look_up
steps:
  look_up: { delegate: { target: reader, as_kind: harness, input: { question: "{{ inputs.question }}" }, store_as: found, then: done } }
  done:    { return: { value: { answer: "{{ facts.found }}" } } }
