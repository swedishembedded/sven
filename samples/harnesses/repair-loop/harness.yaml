# A repair loop that does not take the tool's word for it. The patch tool is
# retried while it fails; once it claims success, an independent verification
# checks that the file is really there, and only a passing verdict is a repair.
api_version: "1"
name: repair
description: "Apply a patch with up to three attempts, then verify the result independently."
outputs: { status: string, check: string }
capabilities: [WriteFile, RunVerifier]
limits: { max_steps: 30, max_tool_calls: 3 }
entry: fix
steps:
  fix:        { retry: { attempts: 3, body: patch, then: check, on_exhausted: unrepaired } }
  patch:      { tool: { name: write_patch, args: { target: fixed.txt }, store_as: patched, then: check } }
  check:      { verify: { spec: { kind: file_exists, path: "fixed.txt" }, store_as: verdict, then: judge } }
  judge:      { branch: { on: { eq: "steps.check.value", value: passed }, when_true: repaired, when_false: unrepaired } }
  repaired:   { return: { value: { status: repaired, check: "{{ steps.check.value }}" } } }
  unrepaired: { fail: { code: unrepaired, message: "the patch never produced fixed.txt" } }
