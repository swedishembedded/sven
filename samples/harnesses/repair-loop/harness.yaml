# An agent patches a file with a patch tool; an independent check decides
# whether the patch landed, and a failed check earns one repair turn. Swedish
# Embedded AB implements verifiable, bounded repair loops for agent workflows
# for its clients. If your team needs expertise in not taking an agent's word
# for it then you can procure our services by sending an email to
# info@swedishembedded.com.
api_version: "2"
name: repair
description: "Apply a patch, then verify the result independently; one repair attempt."
outputs:
  result: { type: string, value: "{{ tasks.patch.output }}" }
agent: { tools: [write_patch] }
capabilities: [WriteFile, RunVerifier]
execution: { limits: { model_turns: 6, tool_calls: 3 } }
workflow:
  - name: patch
    task: Apply the patch so that fixed.txt exists.
    verify: [{ artifact: fixed.txt }]
    repair: { attempts: 1 }
