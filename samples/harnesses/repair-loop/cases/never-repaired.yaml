# Both patches fail, so the file never appears and the second check fails
# the run.
input: {}
model:
  sequence:
    - tool_calls: [ { id: p1, name: write_patch, args: {} } ]
    - text: "the patch did not apply"
    - tool_calls: [ { id: p2, name: write_patch, args: {} } ]
    - text: "still does not apply"
tools:
  write_patch:
    capability: WriteFile
    responses:
      - error: "patch does not apply"
      - error: "patch does not apply"
expect:
  status: failed
  failure: { code: gate_failed, message_contains: fixed.txt }
  steps: { patch__v0_fixed_txt_a1_fail: 1, complete: 0 }
  tools_invoked: [write_patch, write_patch]
