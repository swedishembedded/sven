# The tool answers "patched" but writes nothing: the agent is satisfied, the
# independent check is not, and it does not take the agent's word for it.
input: {}
model:
  sequence:
    - tool_calls: [ { id: p1, name: write_patch, args: {} } ]
    - text: "patched"
    - text: "it is patched, really"
tools:
  write_patch:
    capability: WriteFile
    responses:
      - ok: "patched"
expect:
  status: failed
  failure: { code: gate_failed }
  steps: { patch__v0_fixed_txt_a0: 1, complete: 0 }
