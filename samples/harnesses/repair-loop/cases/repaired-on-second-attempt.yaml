# The first patch fails; the repair turn tries again and the fixture writes
# the file inside the case workspace, so the independent check passes.
input: {}
model:
  sequence:
    - tool_calls: [ { id: p1, name: write_patch, args: {} } ]
    - text: "the patch did not apply"
    - tool_calls: [ { id: p2, name: write_patch, args: {} } ]
    - text: "patched"
tools:
  write_patch:
    capability: WriteFile
    responses:
      - error: "patch does not apply"
      - ok: "patched"
        write: { path: fixed.txt, content: "fixed" }
expect:
  status: completed
  output: { result: "patched" }
  steps: { patch__work: 1, patch__v0_fixed_txt_a0_repair: 1, patch__v0_fixed_txt_a1: 1 }
  tools_invoked: [write_patch, write_patch]
