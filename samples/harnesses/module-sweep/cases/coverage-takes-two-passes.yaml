# The first coverage pass measures 40 and the loop goes round again; the second
# measures 92 and leaves it. Each figure comes from a fresh run of the command.
input: {}
model:
  sequence:
    - tool_calls: [ { id: w1, name: edit_file, args: { path: backlog.json, diff: "@@\n+{}\n" } } ]
    - text: "planned"
    - text: "parser done"
    - text: "lexer done"
    - text: "first pass"
    - text: "second pass"
tools:
  edit_file:
    capability: WriteFile
    responses:
      - ok: "written"
        write: { path: backlog.json, content: '{"items": [{"module": "parser"}, {"module": "lexer"}]}' }
  read_json_snapshot:
    capability: ReadFile
    responses:
      - ok: { digest: "d1", value: [ { module: "parser" }, { module: "lexer" } ] }
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
        write: { path: coverage.json, content: '{"line_pct": 40}' }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
        write: { path: coverage.json, content: '{"line_pct": 92}' }
expect:
  status: completed
  output: { summary: "second pass" }
  steps: { coverage__work: 2 }
