# The plan leaves two modules; each is worked and verified in turn, then the
# coverage pass measures 95 and leaves the loop at once.
input: {}
model:
  sequence:
    - tool_calls: [ { id: w1, name: edit_file, args: { path: backlog.json, diff: "@@\n+{}\n" } } ]
    - text: "planned"
    - text: "parser done"
    - text: "lexer done"
    - text: "coverage raised"
tools:
  edit_file:
    capability: WriteFile
    responses:
      - ok: "written"
        write: { path: backlog.json, content: '{"items": [{"module": "parser"}, {"module": "lexer"}]}' }
  read_json_snapshot:
    capability: ReadFile
    responses:
      - ok: { digest: "d1", value: [ { module: "parser" }, { module: "lexer" } ] }
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
        write: { path: coverage.json, content: '{"line_pct": 95}' }
expect:
  status: completed
  output: { summary: "coverage raised" }
  steps: { modules__work: 2, coverage__work: 1 }
  tools_invoked: [edit_file, read_json_snapshot, shell_gate, shell_gate, shell_gate]
