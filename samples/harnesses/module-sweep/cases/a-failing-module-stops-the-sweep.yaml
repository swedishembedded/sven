# The first module's tests fail after its one repair: the run fails there and
# names the module; the second module is never started.
input: {}
model:
  sequence:
    - tool_calls: [ { id: w1, name: edit_file, args: { path: backlog.json, diff: "@@\n+{}\n" } } ]
    - text: "planned"
    - text: "parser done"
    - text: "parser fixed"
tools:
  edit_file:
    capability: WriteFile
    responses:
      - ok: "written"
        write: { path: backlog.json, content: '{"items": [{"module": "parser"}, {"module": "lexer"}]}' }
  read_json_snapshot:
    capability: ReadFile
    responses:
      - ok: { digest: "d1", value: [ { module: "parser" }, { module: "lexer" } ] }
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "", stderr: "FAIL" }
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "", stderr: "FAIL" }
expect:
  status: failed
  failure: { code: gate_failed, message_contains: "item `parser`" }
  steps: { modules__work: 1 }
