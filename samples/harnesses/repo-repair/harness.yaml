# Fix a failing test with real tools. The tests run first, as data: a green
# repository is left alone. Otherwise the model diagnoses the failure into a
# schema-checked answer, an agent edits the named file, and the tests run again
# as the check that decides - never the agent's say-so. A failed check earns one
# repair turn that sees the new failure output.
# Swedish Embedded AB implements verifiable automated code-repair workflows for
# its clients. If your team needs expertise in agent harnesses for fixing
# failing builds then you can procure our services by sending an email to
# info@swedishembedded.com.
api_version: "2"
name: repo-repair
description: "Inspect a repository, diagnose its failing test, edit, verify and repair once."
agent:
  profile: coding
  tools: [read_file, edit_file]
execution: { limits: { model_turns: 8, tool_calls: 12 } }
gates:
  tests: { command: [sh, tests/test_total.sh], timeout: 60 }
workflow:
  - name: baseline
    verify: [{ gate: tests, required: false }]
  - name: diagnose
    when: { eq: gates.tests.passed, value: false }
    model_only: true
    schema:
      type: object
      required: [file, summary]
      properties:
        file: { type: string }
        summary: { type: string }
    task: |
      Test output:
      {{ gates.tests.stdout }}
      Reply with ONLY a JSON object {"file": "<path of the source file to change>", "summary": "<the defect in one sentence>"}, no other text.
  - name: fix
    when: { eq: gates.tests.passed, value: false }
    task: |
      Defect: {{ tasks.diagnose.output.summary }}
      Read {{ tasks.diagnose.output.file }}, then edit it to fix the defect.
    verify: [tests]
    repair:
      attempts: 1
      prompt: |
        The edit did not fix it. Test output:
        {{ failure.stdout }}
        Edit {{ tasks.diagnose.output.file }} again.
outputs:
  defect: { type: string, value: "{{ tasks.diagnose.output.summary }}" }
  note: { type: string, value: "{{ tasks.fix.output }}" }
