# The agent claims success twice without fixing anything: the check does not
# believe it, and the run fails.
input: {}
model:
  sequence:
    - text: '{"file": "src/total.sh", "summary": "total ignores shipping"}'
    - text: "I fixed it"
    - text: "I fixed it again"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "FAIL", stderr: "" }
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "FAIL", stderr: "" }
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "FAIL", stderr: "" }
expect:
  status: failed
  failure: { code: gate_failed }
  tools_not_invoked: [edit_file]
