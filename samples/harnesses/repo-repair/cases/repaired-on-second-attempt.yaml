# The first edit leaves the discount unhandled; the repair turn sees the new
# failure output, edits again, and the tests pass.
input: {}
model:
  sequence:
    - text: '{"file": "src/total.sh", "summary": "total ignores shipping"}'
    - tool_calls: [ { id: e1, name: edit_file, args: { path: src/total.sh, diff: "@@\n-a\n+b\n" } } ]
    - text: "edited"
    - tool_calls: [ { id: e2, name: edit_file, args: { path: src/total.sh, diff: "@@\n-b\n+c\n" } } ]
    - text: "edited again"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "FAIL no_shipping", stderr: "" }
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "FAIL with_discount", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok no_shipping", stderr: "" }
  edit_file:
    capability: WriteFile
    responses:
      - ok: "edited"
      - ok: "edited"
expect:
  status: completed
  output: { defect: "total ignores shipping", note: "edited again" }
  steps: { diagnose__work: 1, fix__work: 1, fix__v0_tests_a0_repair: 1, fix__v0_tests_a1: 1, fix__v0_tests_a1_fail: 0 }
  tools_invoked: [edit_file, edit_file, shell_gate, shell_gate, shell_gate]
