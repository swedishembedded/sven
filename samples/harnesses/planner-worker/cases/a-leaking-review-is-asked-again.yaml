# The first review quotes the secret; the gate's exit status says so and the
# supervisor is asked again, shown why.
input: { feature: "add a discount" }
model:
  sequence:
    - text: '{"goal": "add the discount to total()"}'
    - text: "discount added"
    - text: "the key is sk-123"
    - text: "looks right"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "", stderr: "secret found" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
expect:
  status: completed
  output: { review: "looks right" }
  steps: { review__v0_no-leak_a0_repair: 1 }
