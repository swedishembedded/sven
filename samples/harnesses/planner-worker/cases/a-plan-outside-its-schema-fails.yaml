# A planner that does not answer in its schema ends the run at once: nothing
# downstream is built on prose.
input: { feature: "add a discount" }
model:
  sequence:
    - text: "I would start by looking at total()"
expect:
  status: failed
  failure: { code: invalid_answer }
  steps: { implement__work: 0 }
