# The planner answers in its schema, the worker reads the goal from it, the
# supervisor reviews and the gate accepts the review.
input: { feature: "add a discount" }
model:
  sequence:
    - text: '{"goal": "add the discount to total()"}'
    - text: "discount added"
    - text: "looks right"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
expect:
  status: completed
  output: { review: "looks right" }
  tools_invoked: [shell_gate, shell_gate]
