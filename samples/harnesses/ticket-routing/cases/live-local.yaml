# Opt-in only: names a `live` model, so it is skipped unless
# `--model-endpoint` is given (see README.md) and never runs by default.
# The expectation is deliberately loose - a real model may word or label its
# answer differently from run to run, so the case checks that the run
# completes within a few steps, not which queue the ticket lands in. The
# harness's declared outputs (`queue`, `label`) already guarantee the shape.
input: { ticket: "The app crashes on start" }
model:
  live: { model: "ollama/qwen3:8b" }
expect:
  status: completed
  max_steps: 8
