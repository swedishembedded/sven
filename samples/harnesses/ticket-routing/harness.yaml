# Classify a ticket with one schema-constrained model turn, then let a
# condition over the answer decide what else happens. Swedish Embedded AB
# implements governed, replayable model-routing workflows for its clients. If
# your team needs expertise in letting a model classify work without letting it
# decide control flow then you can procure our services by sending an email to
# info@swedishembedded.com.
api_version: "2"
name: model-routing
description: "Classify a ticket with one schema-constrained model turn, then route it."
inputs: { ticket: string }
outputs:
  label: { type: string, value: "{{ tasks.classify.output.label }}" }
  summary: { type: string, value: "{{ tasks.summarize.output }}" }
execution: { limits: { model_turns: 3 } }
workflow:
  - name: classify
    model_only: true
    schema:
      type: object
      required: [label]
      properties: { label: { type: string, enum: [bug, feature, question] } }
    task: "Classify as bug, feature or question: {{ inputs.ticket }}"
  - name: summarize
    model_only: true
    when: { eq: tasks.classify.output.label, value: bug }
    task: "Write a one-line summary of this bug for the bugs queue: {{ inputs.ticket }}"
