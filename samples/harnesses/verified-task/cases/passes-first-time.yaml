# The edit works: the test command exits 0, the success condition re-runs it and
# measures coverage from a fresh run.
input: { feature: "add a discount to total()" }
model:
  sequence:
    - tool_calls: [ { id: e1, name: edit_file, args: { path: src/total.sh, diff: "@@\n-a\n+b\n" } } ]
    - text: "implemented the discount"
tools:
  edit_file:
    capability: WriteFile
    responses: [ { ok: "edited" } ]
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
      - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
        write: { path: coverage.json, content: '{"line_pct": 91.5}' }
expect:
  status: completed
  output: { summary: "implemented the discount" }
  tools_invoked: [edit_file, shell_gate, shell_gate, shell_gate]
