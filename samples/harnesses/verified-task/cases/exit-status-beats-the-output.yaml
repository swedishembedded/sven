# gate_command_exit_code_is_authoritative: the program prints that every test
# passed and the agent says so too, but the exit status is 1 both times. Only
# the status counts; the run fails and names the check.
input: { feature: "add a discount to total()" }
model:
  sequence:
    - text: "implemented; all tests pass"
    - text: "fixed; all tests pass now"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "ALL TESTS PASSED", stderr: "" }
      - ok: { exit_code: 1, timed_out: false, error: null, stdout: "ALL TESTS PASSED", stderr: "" }
expect:
  status: failed
  failure: { code: gate_failed, message_contains: "status 1" }
  tools_invoked: [shell_gate, shell_gate]
