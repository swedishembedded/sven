# A test command that hangs is killed at its deadline; a gate that timed out
# has not passed, and the failure says why.
input: { feature: "add a discount to total()" }
model:
  sequence:
    - text: "implemented"
    - text: "tried again"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - ok: { exit_code: null, timed_out: true, error: null, stdout: "", stderr: "" }
      - ok: { exit_code: null, timed_out: true, error: null, stdout: "", stderr: "" }
expect:
  status: failed
  failure: { code: gate_failed, message_contains: "timed out" }
