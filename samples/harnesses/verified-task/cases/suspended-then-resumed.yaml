# Phase one: the test command hangs and the 500 ms deadline suspends the run
# after the agent's turn. Phase two resumes the checkpoint: the interrupted gate
# is run again (a verification is safe to repeat, and a result that never
# arrived proves nothing), the agent is not asked to redo its work, and the
# success condition runs as usual.
input: { feature: "add a discount to total()" }
model:
  sequence:
    - text: "implemented the discount"
tools:
  shell_gate:
    capability: ExecuteShell
    responses:
      - block: true
bounds: { deadline_ms: 500 }
expect:
  status: suspended
  steps: { implement__work: 1 }
resume:
  tools:
    shell_gate:
      capability: ExecuteShell
      responses:
        - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
        - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
        - ok: { exit_code: 0, timed_out: false, error: null, stdout: "ok", stderr: "" }
          write: { path: coverage.json, content: '{"line_pct": 90}' }
  expect:
    status: completed
    output: { summary: "implemented the discount" }
    # The step counts are the run's: the work turn ran once, before the suspension,
    # and the interrupted gate is the same step run again, not a second start.
    steps: { implement__work: 1, implement__v0_test_a0: 1 }
