# The search never returns. Cancelling the run stops the branch that is
# waiting on it - the case would fail with a leaked call if it did not.
input: { topic: "tide tables" }
model:
  rules:
    - { match_type: contains, pattern: "history:", reply: "Tide tables date from antiquity." }
    - { match_type: contains, pattern: "sources:", reply: "unused" }
tools:
  search_slow:
    capability: ReadFile
    responses:
      - block: true
# The cancel must land after the branch has called the search. A tenth of a
# second was not enough on a loaded machine (the run had not reached the call
# yet and the case saw no call at all), so the timer leaves a full second.
bounds: { cancel_after_ms: 1000 }
expect:
  status: cancelled
  tools_invoked: [search_slow]
