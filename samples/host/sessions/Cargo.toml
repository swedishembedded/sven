[package]
# Package names under samples/ are derived from the path:
# `samples/host/sessions` -> `sample-host-sessions`. The Makefile's
# `samples/%/{build,run}` rules depend on that mapping; `make check/gates/samples`
# enforces it.
name = "sample-host-sessions"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Sample: a host serves two agent sessions on one engine, routes their approvals, parks them across a restart and decides them afterwards"
publish = false

[dependencies]
# The ONLY sven dependency a sample may have is the SDK facade - see
# samples/README.md rule 1, enforced by `make check/gates/samples`.
sven-sdk    = { path = "../../../crates/sdk" }
anyhow      = { workspace = true }
async-trait = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }

[dev-dependencies]
tempfile    = { workspace = true }
