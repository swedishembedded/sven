# Architecture ratchet for the sven workspace.
#
# Enforced by `cargo run -p xtask -- arch` (wired into `make check`, runs before
# clippy). Method and rationale: /data/workspace/.claude/skills/programming/rust/architecture.md
# and /home/user/.claude/plans/use-cargo-tree-to-snug-pebble.md (the refactor plan
# this file bootstraps).
#
# Rules:
#   - A crate may depend (as a normal, non-dev dependency) only on crates at a
#     STRICTLY LOWER tier, unless the ordered pair is listed in [[same_layer]].
#   - dev-dependencies are exempt from the tier check entirely.
#   - Every [[allow.*]] entry below is a REVIEWED, TEMPORARY exception with a
#     `why` explaining what it is and when it goes away. A stale entry (the
#     violation it names no longer exists) is itself a failure — delete it when
#     you fix the underlying issue, don't leave it behind.
#   - `[[allow.large_file]]` entries are a high-water mark: `lines` may only
#     shrink release over release. `cargo run -p xtask -- arch --bless`
#     regenerates this section from the live tree (note: bless rewrites the
#     whole file and does not preserve comments outside `why`/data fields).

[tiers]
# Ordered low -> high. A crate may depend only on tiers strictly below its own
# (or same-tier, if explicitly listed in [[same_layer]]).
order = [
    "foundation", # zero internal sven deps
    "kernel",     # trait/type vocabulary: config schema, HSM types, provider trait, wire ids
    "services",   # concrete registries/stores built on the kernel vocabulary
    "domain",     # tool implementations and other domain services
    "machines",   # pure Machine impls + the I/O executor layer that drives them
    "assembly",   # the composition root(s): RuntimeBuilder and friends
    "wiring",     # async surface plumbing shared by every frontend
    "surface",    # user-visible entry points (CLI/TUI/GUI, headless runner, node, MCP server)
    "composite",  # surfaces that assemble other surfaces (ACP proxies a node; cloud fronts a companion)
    "binary",     # the `sven` binary itself
]

[crates]
# foundation
sven-config      = "foundation"
sven-hsm         = "foundation"
sven-image       = "foundation"
sven-node-client = "foundation"
sven-p2p         = "foundation"
sven-runtime     = "foundation"
trace            = "foundation"

# kernel
sven-graph  = "kernel"
sven-model  = "kernel"
sven-wire   = "kernel"
sven-control = "kernel"

# services
sven-input      = "services"
sven-llm        = "services"
sven-tools      = "services"
sven-mcp-client = "services"

# domain
sven-channels      = "domain"
sven-integrations  = "domain"
sven-memory        = "domain"
sven-metering      = "domain"
sven-scheduler     = "domain"
sven-team          = "domain"

# machines
sven-core      = "machines"
sven-executors = "machines"

# assembly
sven-bootstrap = "assembly"
sven-companion = "assembly"

# wiring
sven-frontend = "wiring"

# surface
sven-ci  = "surface"
sven-gui = "surface"
sven-mcp = "surface"
sven-node = "surface"
sven-tui = "surface"

# composite
sven-acp   = "composite"
sven-cloud = "composite"

# binary
sven = "binary"

# tooling (not part of the production dependency graph; zero sven deps)
xtask = "foundation"

# ── Legitimate same-tier edges. Each needs a `why`. ─────────────────────────
[[same_layer]]
from = "sven-mcp-client"
to   = "sven-tools"
why  = """
TEMPORARY, tracked for Phase 5 of the refactor plan. mcp-client adapts external
MCP tools into sven-tools's ToolSchema, so it needs the tool-vocabulary types.
Once sven-tools splits into sven-tool-api (kernel tier, just the Tool trait +
ToolSchema) and sven-tool-registry (services tier, the registry impl),
mcp-client repoints at sven-tool-api and this edge becomes legitimately
downward. Delete this entry when that split lands.
"""

[[same_layer]]
from = "sven-executors"
to   = "sven-core"
why  = """
TEMPORARY, tracked for Phase 4.1-4.2 of the refactor plan. This is NOT a
legitimate peer edge: core/src/stream_turn.rs (the actual async LLM call) and
core/src/compact.rs are impure turn-execution primitives misfiled in the
"pure machines" crate. Nothing under core/src/machines/ imports sven_model;
stream_turn.rs and compact.rs do. Phase 4.1 extracts them into a new
sven-turn crate (domain tier); sven-executors depends on that instead and this
same-tier edge disappears rather than being legitimized. See
docs/adr/ (refactor plan) for the full analysis. Delete this entry when Phase
4.1-4.2 land.
"""

# ── Known upward (illegal) edges, each with a fix owner and a why. ─────────
[[allow.upward]]
from = "sven-wire"
to   = "sven-tools"
why  = """
sven-wire (kernel tier: protocol DTOs) depends on sven-tools (services tier)
only for two From/Into conversions between WireToolOutput and
sven_tools::ToolOutput (wire/src/messages.rs). Fix: Phase 2.1-2.2 of the
refactor plan moves ToolCall/ToolOutput down into a new sven-vocab crate
(foundation tier); sven-wire depends on that instead and this edge is deleted,
not legitimized.
"""

[[allow.upward]]
from = "sven-control"
to   = "sven-tools"
why  = """
sven-control (kernel tier: the operator control protocol) depends on
sven-tools (services tier) for the same reason as sven-wire above -- it needs
ToolCall/ToolCapability-shaped types to describe tool activity over the
control protocol. Fix: same as sven-wire, Phase 2.1-2.2 moves those types to
sven-vocab (foundation tier).
"""

[[allow.upward]]
from = "sven-metering"
to   = "sven-executors"
why  = """
sven-metering (domain tier: pricing + credit ledger) depends on
sven-executors (machines tier) only for three sha256 append-only JSONL
hash-chain helpers (append_chain/read_chain/verify_chain, co-located with
AuditExecutor in executors/src/audit.rs) that have nothing to do with effects
or I/O. Fix: Phase 2.3 of the refactor plan extracts those three functions
into a new sven-chain crate (foundation tier); sven-metering and
sven-companion both repoint at that and this edge is deleted.
"""

# ── Known dead/unused internal dependencies. ────────────────────────────────
# A dependency is "dead" here if crate `crate` declares a normal (non-dev) dep
# on `dep` but has zero real (non-comment) `dep_ident::` references under its
# own src/. The 3 manually-audited entries and 11 of the 13 xtask found on its
# first run were fixed in this commit. sven-gui's 2 entries remain, pending
# Phase 1.2's deletion of the crate.
[[allow.dead_dep]]
crate = "sven-gui"
dep   = "sven-bootstrap"
why   = "No sven_bootstrap:: reference anywhere under crates/gui/src. Moot once crates/gui is deleted in Phase 1.2."
[[allow.dead_dep]]
crate = "sven-gui"
dep   = "sven-mcp-client"
why   = "No sven_mcp_client:: reference anywhere under crates/gui/src. Moot once crates/gui is deleted in Phase 1.2."

