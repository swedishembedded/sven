# Architecture ratchet for the sven workspace.
#
# Enforced by `cargo run -p xtask -- arch` (wired into `make check`, runs before
# clippy). Method and rationale: /data/workspace/.claude/skills/programming/rust/architecture.md
# and /home/user/.claude/plans/use-cargo-tree-to-snug-pebble.md (the refactor plan
# this file bootstraps).
#
# Rules:
#   - A crate may depend (as a normal, non-dev dependency) only on crates at a
#     STRICTLY LOWER tier, unless the ordered pair is listed in [[same_layer]].
#   - dev-dependencies are exempt from the tier check entirely.
#   - Every [[allow.*]] entry below is a REVIEWED, TEMPORARY exception with a
#     `why` explaining what it is and when it goes away. A stale entry (the
#     violation it names no longer exists) is itself a failure — delete it when
#     you fix the underlying issue, don't leave it behind.
#   - `[[allow.large_file]]` entries are a high-water mark: `lines` may only
#     shrink release over release. `cargo run -p xtask -- arch --bless`
#     regenerates this section from the live tree (note: bless rewrites the
#     whole file and does not preserve comments outside `why`/data fields).

[tiers]
# Ordered low -> high. A crate may depend only on tiers strictly below its own
# (or same-tier, if explicitly listed in [[same_layer]]).
order = [
    "foundation", # zero internal sven deps
    "kernel",     # trait/type vocabulary: config schema, HSM types, provider trait, wire ids
    "services",   # concrete registries/stores built on the kernel vocabulary
    "domain",     # tool implementations and other domain services
    "machines",   # pure Machine impls + the I/O executor layer that drives them
    "assembly",   # the composition root(s): RuntimeBuilder and friends
    "wiring",     # async surface plumbing shared by every frontend
    "surface",    # user-visible entry points (CLI/TUI/GUI, headless runner, node, MCP server)
    "composite",  # surfaces that assemble other surfaces (ACP proxies a node; cloud fronts a companion)
    "binary",     # the `sven` binary itself
]

[crates]
# foundation
sven-chain       = "foundation"
sven-cloud-store = "foundation"
sven-config      = "foundation"
sven-hsm         = "foundation"
sven-image       = "foundation"
sven-node-client = "foundation"
sven-node-config = "foundation"
sven-node-web    = "foundation"
sven-p2p         = "foundation"
sven-workspace   = "foundation"
sven-vocab       = "foundation"
atif             = "foundation"

# kernel
sven-model  = "kernel"
sven-model-catalog = "kernel"
sven-wire   = "kernel"
sven-control = "kernel"
sven-session-model = "kernel"
sven-tool-api = "kernel"
sven-cloud-identity = "kernel"

# services
sven-session-store = "services"
sven-llm        = "services"
sven-tools      = "services"
sven-tool-registry = "services"
sven-mcp-client = "services"
sven-kernel     = "services"
sven-node-chat  = "services"
sven-model-drivers = "services"
sven-model-mock    = "services"

# domain
sven-channels      = "domain"
sven-integrations  = "domain"
sven-memory        = "domain"
sven-metering      = "domain"
sven-scheduler     = "domain"
sven-team          = "domain"
sven-turn          = "domain"

# machines
sven-machines  = "machines"
sven-executors = "machines"
sven-cloud-metering = "machines"

# assembly
sven-bootstrap = "assembly"
sven-commands  = "assembly"
sven-companion = "assembly"
sven-cloud-tether = "assembly"

# wiring
sven-frontend = "wiring"
sven-node-control = "wiring"
sven-node-http    = "wiring"
sven-node-p2p     = "wiring"

# surface
sven-ci  = "surface"
sven-mcp = "surface"
sven-node = "surface"
sven-tui = "surface"

# composite
sven-acp   = "composite"
sven-cloud = "composite"
sven-cloud-portal = "composite"

# binary
sven = "binary"

# tooling (not part of the production dependency graph; zero sven deps)
xtask = "foundation"

# ── Legitimate same-tier edges. Each needs a `why`. ─────────────────────────
[[same_layer]]
from = "sven-tools"
to   = "sven-tool-registry"
why  = """
TEMPORARY, Phase 5.1 of the refactor plan. sven-tools split into sven-tool-api
(kernel tier: the Tool trait + its interface) and sven-tool-registry (services
tier: the concrete ToolRegistry + config-driven policy engines), but the ~18k
LOC of built-in tool *implementations* (crates/tools/src/builtin/) have not
yet been carved into their own per-concern domain crates (5.2-5.8 of the
plan). Until that lands, sven-tools stays at services tier -- it is still the
home of those implementations -- and re-exports both new crates' public
surface at their original module paths so the ~20 crates that still write
`sven_tools::ToolRegistry` / `sven_tools::ApprovalPolicy` keep compiling.
sven-tools -> sven-tool-api is already a legal downward edge (kernel < services)
and needs no exception. No cycle risk: sven-tool-registry does not and cannot
depend back on sven-tools. Delete this entry once builtin/ moves out and
sven-tools's own dependency on the registry (kept only for the re-export shim)
goes with it.
"""

[[same_layer]]
from = "sven-config"
to   = "sven-vocab"
why  = """
Both are leaf, no-further-layering "foundation" crates. sven-config needs
AgentMode (now defined in sven-vocab alongside the other event/session
payload types it groups with, per Phase 3 of the refactor plan) for its CLI
schema. Not a same-tier violation in spirit -- config has zero dependents at
the foundation tier itself, so this can never become a cycle -- but the
checker only reasons about tiers, not sub-tier leaf status, so it is
recorded explicitly rather than silently allowed.
"""

[[same_layer]]
from = "sven-model"
to   = "sven-model-catalog"
why  = """
Both are "kernel" tier: pure trait/type vocabulary crates, no heavy deps (no
reqwest, no cloud SDKs). Phase 5 of the refactor plan split sven-model's
static catalog data (ModelCatalogEntry, static_catalog(), lookup(), the
on-disk live-cache overlay) out into sven-model-catalog so sven-tools et al.
could depend on just the data without the ~10k-LOC god-crate. sven-model
still needs it directly: ModelProvider's default trait methods
(catalog_max_output_tokens, input_modalities, ...) call straight into the
catalog, and sanitize::strip_images_if_unsupported needs InputModality. No
cycle risk: sven-model-catalog has zero sven-tier dependencies of its own.
"""

[[same_layer]]
from = "sven-model-drivers"
to   = "sven-model-mock"
why  = """
TEMPORARY, precedented by the sven-mcp-client -> sven-tools entry above.
Both are "services" tier: concrete ModelProvider implementations built on
the sven-model kernel vocabulary. sven-model-drivers's from_config() factory
constructs a mock provider unconditionally for `provider: "mock"` today (see
DRIVERS.md) -- that match arm is the single call site pulling in
sven-model-mock as a real (non-dev) dependency. Refactor plan Phase 6 is
expected to put mock support behind a feature flag so it stops shipping in
release builds; at that point sven-model-mock becomes an optional/dev-only
dependency of sven-model-drivers and this edge either disappears or becomes
a legitimate feature-gated same-tier edge recorded here with an updated why.
"""

[[same_layer]]
from = "sven-session-model"
to   = "sven-model"
why  = """
Both are "kernel" tier: pure trait/type vocabulary crates, no execution.
sven-session-model needs sven_model::{Message, MessageContent, Role} to name
the messages a ChatSegment/conversation-codec deals in. Placed at kernel
(rather than services, where its only current sven-tier peer requirement
would have been trivially satisfiable) specifically so sven-input (services)
can depend on it downward without a second exception: sven-session-model is
becoming the new home for sven-input's `## User`/`## Sven` markdown codec
(Phase 3.7), and services strictly above kernel is exactly the edge that
move needs. No cycle risk: sven-model has no sven-tier dependents at the
kernel tier itself.
"""

[[same_layer]]
from = "sven-hsm"
to   = "sven-vocab"
why  = """
Both are leaf "foundation" crates. sven-hsm's outward observation plane
(UiEvent) is now `sven_vocab::SessionEvent` -- the unified event enum shared
with sven-core's AgentEvent (Phase 3 of the refactor plan) -- rather than a
kernel-local opaque-payload enum, since SessionEvent's typed payloads
(ToolCall, TodoItem, ...) live in sven-vocab. sven-vocab has zero
dependencies of its own, so this can never become a cycle.
"""

[[same_layer]]
from = "sven-node-config"
to   = "sven-p2p"
why  = """
Both are leaf "foundation" crates (zero sven-internal dependencies of their
own before this edge). sven-node-config's build_agent_card (NodeConfig ->
AgentCard, a pure data transform) needs sven_p2p::protocol::types::AgentCard.
build_agent_card moved here from sven-node::node specifically to break a real
sven-node::node <-> sven-node::peer intra-crate cycle when peer.rs was
extracted into sven-node-chat (Phase 5 god-crate split) -- see
sven-node-config's crate doc comment. sven-p2p has no dependency on
sven-node-config, so this can never become a cycle.
"""

[[same_layer]]
from = "sven-node-http"
to   = "sven-node-control"
why  = """
Both are "wiring" tier (Phase 5 god-crate split of sven-node). sven-node-http
is sven-node's HTTPS/WebSocket transport; it needs sven-node-control's
AgentHandle/ControlCommand/ControlEvent to speak the wire protocol over that
transport. sven-node-control is forced to "wiring" (not lower) because its
ControlService owns a real sven_bootstrap::RuntimeHandle (assembly tier) --
see sven-node-control's crate doc comment. No cycle risk: sven-node-control
has no dependency on sven-node-http.
"""

[[same_layer]]
from = "sven-node-p2p"
to   = "sven-node-control"
why  = """
Same reasoning as sven-node-http -> sven-node-control immediately above:
sven-node-p2p is sven-node's P2P operator-control transport (the counterpart
to sven-node-http for native/mobile clients) and needs the same
AgentHandle/ControlCommand/ControlEvent types. No cycle risk: sven-node-control
has no dependency on sven-node-p2p.
"""

[[same_layer]]
from = "sven-cloud"
to   = "sven-cloud-portal"
why  = """
Phase 5 of the refactor plan split sven-cloud's `portal`/`feed`/`channels`/
`runtime` modules into sven-cloud-portal. Both crates need
sven_node::control::protocol (surface tier), which puts a floor of
"composite" under each of them individually -- there is no lower tier left
for either to sit at, so this is not a missed opportunity to avoid the
same-tier edge, it is the tier the real dependencies put them at.

The edge is one-directional and cannot become a cycle: sven-cloud's
CloudServer (the axum/TLS WSS tether+share+operator-ws listener) needs
sven-cloud-portal's CloudSessionLauncher and SessionFeed, but nothing in
sven-cloud-portal depends on sven-cloud -- the one edge that used to run the
other way (`portal.rs`'s `use crate::server::extract_bearer`) was cut by
giving each crate its own six-line copy of that helper rather than sharing
it. sven-cloud-portal itself could not be split further (feed/channels/
portal/runtime) without recreating this same edge in the opposite
direction: CloudServer and PortalState both need CloudSessionLauncher, and
CloudSessionLauncher needs SessionFeed, so whichever piece ended up in the
"lower" crate would still need the "higher" one.
"""


# ── Known upward (illegal) edges, each with a fix owner and a why. ─────────
# None currently outstanding. sven-wire and sven-control both depended on
# sven-tools only for ToolCall/ToolOutput/ToolSchema, which moved to
# sven-vocab (foundation tier) in Phase 2.1-2.2 -- deleting both edges
# rather than legitimizing them.

