    pages:
      - docs/contributing/index.md
      - source: samples/README.md
        path: contributing/samples.md
        title: Writing a sample
      - docs/contributing/ablation-benchmarks.md
      - docs/contributing/decision-experiments.md
# Architecture decision records are kept in the repository for maintainers,
# not published.
exclude:
