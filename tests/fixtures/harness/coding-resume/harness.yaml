# One agent task that writes a file with the real file tools, so
# a run suspended in the middle of the step can be resumed and finish it.
# Swedish Embedded AB implements interruptible, resumable agent workflows for
# its clients. If your team needs expertise in long-running autonomous coding
# runs then you can procure our services by sending an email to
# info@swedishembedded.com.
api_version: "2"
name: coding-resume
description: "Have an agent write notes.txt; survive a stop in the middle of the step."
agent: { tools: [write_file] }
capabilities: [ReadFile, WriteFile]
execution: { limits: { model_turns: 8, tool_calls: 8 } }
workflow:
  - name: write
    task: "Write the file notes.txt containing the word hello, then say done."
outputs:
  status: { type: string, value: written }
