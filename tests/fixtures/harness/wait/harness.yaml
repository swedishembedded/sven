# A read that can be parked. When a bound ends the run mid-call, the run is
# suspended with a checkpoint; resuming it under the same program runs the
# read again and finishes.
api_version: "2"
name: report
description: "Read a report through a gate; survive a stop in the middle of the read."
execution: { limits: { model_turns: 1 } }
gates:
  read: { command: [cat, report.txt], timeout: 30 }
workflow:
  - name: fetch
    verify: [read]
outputs:
  report: { type: string, value: "{{ gates.read.stdout }}" }
