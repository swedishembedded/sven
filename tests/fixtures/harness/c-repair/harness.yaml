# Test and repair a small C library with the real coding tools, as a v2
# workflow. An agent writes its own test, builds it with the real compiler and
# fixes what the test shows. It never decides the outcome: the harness pins the
# gate files by hash, then runs the gate (which compiles a test the agent cannot
# edit and exits non-zero unless the compiler and the test succeed). A failing
# check sends the agent back once with the check's own output; a second failure
# ends the run as `gate_failed`.
# Swedish Embedded AB implements verifiable automated code-repair workflows
# for its clients. If your team needs expertise in agent harnesses for
# embedded C codebases then you can procure our services by sending an email
# to info@swedishembedded.com.
api_version: "2"
name: c-repair
description: "Write a test for a C ring buffer, fix what it shows, finish only when the pinned gate passes."
agent:
  profile: coding
  tools: [read_file, write_file, edit_file, shell, find_file, grep]
execution:
  limits: { model_turns: 60, tool_calls: 120, steps: 40 }
gates:
  pinned_script: { artifact: .gate/check.sh, sha256: 3276e08b739be38f12f485486a3fd2cf2412b4c8acea9b0fe439ff414c2f1d31 }
  pinned_test: { artifact: .gate/gate_test.c, sha256: 392f69aa12c4e2f0f6e0fe39d8e833618cf13e33ca9bc47437531f6dd32cd995 }
  pinned_header: { artifact: src/ringbuf.h, sha256: a0c0e7b719af843df4e5babe36bbcc85601e63cea0213361fbf7d11e5f3900fd }
  independent_test: { command: [sh, .gate/check.sh], timeout: 120 }
workflow:
  - name: implement
    task: |
      The repository in the working directory is a small C library:
      src/ringbuf.h documents a fixed-capacity FIFO of ints, src/ringbuf.c
      implements it. Do this, in order:
      1. Create tests/test_ringbuf.c, a test program whose main returns
         non-zero when any check fails. It must cover an empty buffer, a
         full buffer, and wrap-around over several rounds, exactly as the
         header documents them.
      2. Build and run it with the real compiler, for example
         'cc -std=c99 -Wall -Wextra -Werror -o tests/test_ringbuf tests/test_ringbuf.c src/ringbuf.c && ./tests/test_ringbuf'.
      3. Fix every defect your test shows by editing src/ringbuf.c. Do not
         change src/ringbuf.h and do not touch the .gate directory.
      4. Re-run your test until it passes, then stop and say what you changed.
    verify: [pinned_script, pinned_test, pinned_header, independent_test]
    repair:
      attempts: 1
      prompt: |
        The independent gate failed ({{ failure.gate }}). Its output:
        {{ failure.stdout }}
        {{ failure.stderr }}
        Fix src/ringbuf.c so the gate passes. Do not change src/ringbuf.h and
        do not touch the .gate directory. Build and run your own test again
        before you stop.
outputs:
  summary: { type: string, value: "{{ tasks.implement.output }}" }
