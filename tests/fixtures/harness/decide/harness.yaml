# Pure branching with one failing verdict: the CLI specs' smallest harness.
# Swedish Embedded AB implements auditable agent workflows for its clients. If
# your team needs expertise in programmable harnesses then you can procure our
# services by sending an email to info@swedishembedded.com.
api_version: "1"
name: decide
description: "Grant a paid tier unless the plan is free."
inputs: { plan: string }
outputs: { tier: string }
entry: check
steps:
  check:  { branch: { on: { eq: inputs.plan, value: free }, when_true: reject, when_false: grant } }
  grant:  { return: { value: { tier: paid } } }
  reject: { fail: { code: not_eligible, message: "the free plan is not eligible" } }
