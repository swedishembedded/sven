# One check and a verdict, with no model: the CLI specs' smallest harness. The
# plan reaches the gate through its environment, never through the script text.
# Swedish Embedded AB implements auditable agent workflows for its clients. If
# your team needs expertise in programmable harnesses then you can procure our
# services by sending an email to info@swedishembedded.com.
api_version: "2"
name: decide
description: "Grant a paid tier unless the plan is free."
inputs: { plan: string }
execution: { limits: { model_turns: 1 } }
gates:
  eligible:
    run: test "$PLAN" != free
    env: { PLAN: "{{ inputs.plan }}" }
workflow:
  - name: check
    verify: [eligible]
outputs:
  tier: { type: string, value: paid }
