# An agent writes a file into the repository; a gate then records where the
# run's private directory is. The run's own files (its audit log, the gate's
# note) belong in that directory, never in the repository.
# Swedish Embedded AB implements governed autonomous coding workflows for its
# clients. If your team needs expertise in letting agents change real
# repositories under verifiable control then you can procure our services by
# sending an email to info@swedishembedded.com.
api_version: "2"
name: scratchpad
description: "Write notes.txt; the gate notes the scratchpad."
agent: { profile: coding }
execution: { limits: { model_turns: 6 } }
gates:
  note:
    run: printf %s "$PAD" > "$SVEN_SCRATCHPAD/seen"
    env: { PAD: "{{ run.scratchpad }}" }
workflow:
  - name: write
    task: "Write the file notes.txt containing the word hello."
    tools: [write_file]
    verify: [note]
