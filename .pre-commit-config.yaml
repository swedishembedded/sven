# .pre-commit-config.yaml
# Run `pre-commit autoupdate` periodically to keep hook versions current.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
# Stop on first failure so we don't run slow hooks (e.g. clippy) after fmt fails.
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # The text gates `make check` runs (via `make check/gates`), wired here
      # so they also fire at commit time. Keep this list and
      # scripts/hooks/pre-commit in sync: a gate added to only one of them
      # silently stops being enforced for whoever installed the other. Neither
      # is the only enforcement path - `make check` runs every gate from a
      # clean clone with no hook installed at all.
      - id: no-machine-paths
        name: no absolute machine paths
        entry: bash scripts/gates/check-no-machine-paths.sh
        language: system
        types: [text]
        pass_filenames: true

      # No file arguments: the question is "does the workspace resolve a
      # brain package", which is answered by Cargo.toml + Cargo.lock as a
      # whole, not by whichever manifest happens to be staged.
      - id: no-brain-dependency
        name: sven must not depend on brain
        entry: bash scripts/gates/check-no-brain-dependency.sh
        language: system
        files: '(^|/)Cargo\.(toml|lock)$'
        pass_filenames: false

      # No tracked file names a project outside sven's scope (AGENTS.md,
      # Repository scope). Also run by `make check/gates/repo-scope`.
      - id: repo-scope
        name: no out-of-scope project names
        entry: bash scripts/gates/check-repo-scope.sh
        language: system
        types: [text]
        pass_filenames: true

      # Make target names form a tree and are documented (`make help`). Also
      # run by `make check/gates/make-targets`.
      - id: make-targets
        name: make targets are a documented tree
        entry: bash scripts/gates/check-make-targets.sh
        language: system
        files: '(^|/)Makefile$'
        pass_filenames: false

      # Environment reads only shrink: a new one needs a CLI flag instead.
      # Also run by `make check/gates/env-reads`.
      - id: env-reads
        name: no new environment reads
        entry: bash scripts/gates/check-env-reads.sh
        language: system
        files: '(\.rs$|^scripts/gates/env-reads\.allow$)'
        pass_filenames: false

      # The roadmap index is generated from the ledgers and every ledger
      # states its scope. Also run by `make check/gates/roadmap-index`.
      - id: roadmap-index
        name: roadmap index matches its ledgers
        entry: bash scripts/gates/check-roadmap-index.sh
        language: system
        files: '^\.agents/roadmap/'
        pass_filenames: false

      # Replace common non-ASCII punctuation (em/en dashes, curly quotes,
      # ellipsis, non-breaking spaces) with plain ASCII equivalents so the
      # repository stays pure ASCII in all text and markdown files.
      - id: normalize-ascii
        name: normalize non-ASCII punctuation
        entry: bash scripts/normalize-ascii.sh
        language: system
        types: [text]
        # The vendored docs publisher reproduces third-party license texts
        # verbatim and is pinned by sha256.
        exclude: '(\.min\.(js|css)$|^tools/docs-publisher/)'
        pass_filenames: true

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: true

      # Clippy runs only on packages that contain the passed (staged) files.
      # On commit: only changed packages are checked. Use "pre-commit run --all-files"
      # to check the full workspace.
      - id: cargo-clippy
        name: cargo clippy
        entry: bash scripts/clippy-staged.sh
        language: system
        types: [rust]
        pass_filenames: true
