# cargo-release configuration
# Install: cargo install cargo-release   (Makefile does this automatically)
# Usage:   make release/patch   (or /minor  /major)
#
# What cargo-release does on --execute:
#   1. Runs pre-release-hook (full test suite)
#   2. Bumps version in Cargo.toml
#   3. git commit "chore: release vX.Y.Z"
#   4. git tag  vX.Y.Z  (annotated)
#   → `make release/publish` then pushes HEAD and the tag, which triggers
#     .github/workflows/release.yml, and attaches the signed .deb

# push is disabled here so cargo-release does not use libgit2/gix for the push.
# Those libraries have their own SSH stack that bypasses ssh-agent and prompt
# for the passphrase even when the key is already loaded.  `make release/publish`
# runs "git push" itself, which uses the system git binary and correctly honours
# the running ssh-agent.
push         = false
publish      = false          # sven is a binary tool, not a crates.io library
sign-tag     = false
sign-commit  = false

# One commit for the release: every crate shares the workspace version
# (shared-version = "workspace"), and cargo-release 1.x refuses anything else
# for such a workspace. {{version}} still expands in the commit message, since
# the version is shared.
consolidate-commits = true

# What a release changes besides the version: the changelog's Unreleased
# section becomes the release's, dated, under a new empty Unreleased; and
# .bumpversion.cfg keeps the version bump2version would find.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = ".bumpversion.cfg", search = "current_version = .*", replace = "current_version = {{version}}", exactly = 1 },
]

pre-release-commit-message = "chore: release v{{version}}"

tag-name    = "v{{version}}"
tag-message = "Release v{{version}}"

allow-branch = ["main"]

# Tests are run by the Makefile release targets (make release/minor etc.)
# *before* invoking cargo-release so that a test failure never leaves
# Cargo.toml with a bumped but uncommitted version.
# pre-release-hook is intentionally omitted here.
