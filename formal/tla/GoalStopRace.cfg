\*
\* Stop at any moment, also between a command's answer being sent and
\* arriving: the stopped answer's end can still be on its way when the next
\* answer opens. Every end names its answer, so it never closes the next
\* one. MUST pass, including the liveness that every answer ends.
CONSTANT MachineEndsTurn = TRUE
CONSTANT KernelContinues = TRUE
CONSTANT StopAnytime = TRUE
CONSTANT AnswerIds = TRUE
CONSTANT ReportDecides = FALSE
CONSTANT MaxTurns = 2
CONSTANT MaxInputs = 3
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoGoalTurnUnlessActive
INVARIANT NoWorkAfterTheAnswerEnded
INVARIANT CompletionNeedsAPassingCheck
PROPERTY EveryAnswerEnds
