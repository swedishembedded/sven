\*
\* A tracked gap: Stop at any moment, also between a command's answer being
\* sent and arriving. Turn ends are not correlated to the input they answer,
\* so the stopped answer's late end closes the next one. EXPECTED to fail on
\* NoWorkAfterTheAnswerEnded until turn ends carry the input they answer.
CONSTANT MachineEndsTurn = TRUE
CONSTANT KernelContinues = TRUE
CONSTANT StopAnytime = TRUE
CONSTANT ReportDecides = FALSE
CONSTANT MaxTurns = 2
CONSTANT MaxInputs = 3
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoWorkAfterTheAnswerEnded
