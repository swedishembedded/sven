\*
\* Exiting from the state whose handler fired instead of from the active leaf:
\* the obvious reading of "the source of the transition", and the one that
\* leaves a leaf's exit action unrun when a superstate handles the event.
\* MUST FAIL on ConfigurationIsTheAncestorChain.
CONSTANT ExitFromActiveLeaf = FALSE
CONSTANT GenuineLca = TRUE
CONSTANT SelfTransitionIsExternal = TRUE
CONSTANT RestoreLeafOnly = TRUE
CONSTANT DrillGuard = TRUE
CONSTANT MalformedInit = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ConfigurationIsTheAncestorChain
