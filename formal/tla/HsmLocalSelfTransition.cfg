\*
\* A self-transition treated as local (LCA = the state itself), so neither its
\* exit nor its entry action runs. MUST FAIL on SelfTransitionRestartsItsState.
CONSTANT ExitFromActiveLeaf = TRUE
CONSTANT GenuineLca = TRUE
CONSTANT SelfTransitionIsExternal = FALSE
CONSTANT RestoreLeafOnly = TRUE
CONSTANT DrillGuard = TRUE
CONSTANT MalformedInit = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SelfTransitionRestartsItsState
