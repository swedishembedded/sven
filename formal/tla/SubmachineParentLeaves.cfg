\*
\* A parent that takes a transition of its own while a child is live. This is
\* a TRACKED GAP, not a rejected design: the host cannot see it today, and
\* closing it needs an ownership link the kernel does not have.
\* MUST FAIL on NoOrphanedChild.
CONSTANT CompleteOnInstall = TRUE
CONSTANT ParentCanLeave = TRUE
CONSTANT ChildStartsDone = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoOrphanedChild
