\*
\* Rejected: the turn executor ends the person's turn after every reply
\* without tool calls. MUST FAIL on NoWorkAfterTheAnswerEnded: the goal's
\* next turn runs after the surface closed the answer.
CONSTANT MachineEndsTurn = FALSE
CONSTANT KernelContinues = TRUE
CONSTANT StopAnytime = FALSE
CONSTANT AnswerIds = TRUE
CONSTANT ReportDecides = FALSE
CONSTANT MaxTurns = 2
CONSTANT MaxInputs = 3
\* A behaviour ends when the person has made their inputs and everything
\* they started has settled: that is a resting session, not a deadlock.
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoWorkAfterTheAnswerEnded
