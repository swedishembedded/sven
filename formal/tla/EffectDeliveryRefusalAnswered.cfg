\*
\* The smallest change that closes the stall: keep the all-or-nothing batch,
\* but answer the machine the way a refused tool already is.
\* `InnocentEffectSurvivesARefusal` is deliberately not checked here - the
\* batch decision still costs it, and this configuration is about the stall.
\* MUST pass.
CONSTANT BatchAllOrNothing = TRUE
CONSTANT RefusalFeedsBackAnEvent = TRUE
\* A model with no action enabled is this runtime waiting for the outside
\* world, not a bug - except where it is exactly the bug, and there the
\* invariant below names it rather than leaving it as a generic deadlock.
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoSilentStall
