\*
\* Renewing on the stop alone: a final reply queued when the stop comes ends
\* the turn with its announcement dropped. MUST fail EveryTurnEndsOnce.
CONSTANT Renew = "OnStop"
CONSTANT AnnounceSurvivesStop = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT EveryTurnEndsOnce
