\*
\* The same malformed machine with the guard the engine now has. The
\* configuration invariants are deliberately NOT checked here: a machine whose
\* `Init` names a non-descendant has already broken the hierarchy contract, and
\* the guard does not promise to repair it. It promises the dispatch returns,
\* so a contract violation surfaces as a wrong state rather than as a hung
\* agent. MUST pass.
CONSTANT ExitFromActiveLeaf = TRUE
CONSTANT GenuineLca = TRUE
CONSTANT SelfTransitionIsExternal = TRUE
CONSTANT RestoreLeafOnly = TRUE
CONSTANT DrillGuard = TRUE
CONSTANT MalformedInit = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY DispatchTerminates
