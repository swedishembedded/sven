\* Gating every effect on its own, the way the CallTool path already does.
\* This is what the all-or-nothing decision costs, priced: it keeps both
\* properties. MUST pass.
CONSTANT BatchAllOrNothing = FALSE
CONSTANT RefusalFeedsBackAnEvent = TRUE
\* A model with no action enabled is this runtime waiting for the outside
\* world, not a bug - except where it is exactly the bug, and there the
\* invariant below names it rather than leaving it as a generic deadlock.
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoSilentStall
INVARIANT InnocentEffectSurvivesARefusal
