\*
\* A machine whose `Init` transitions form a cycle, driven by the unguarded
\* drill loop `drill_into_composites` had before this model. The dispatch
\* never returns, so the runtime's single consumer task never processes
\* another event. MUST FAIL on DispatchTerminates.
CONSTANT ExitFromActiveLeaf = TRUE
CONSTANT GenuineLca = TRUE
CONSTANT SelfTransitionIsExternal = TRUE
CONSTANT RestoreLeafOnly = TRUE
CONSTANT DrillGuard = FALSE
CONSTANT MalformedInit = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY DispatchTerminates
