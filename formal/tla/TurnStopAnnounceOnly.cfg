\*
\* Keeping announcements alone: the stop, dispatched under the scope it
\* stopped, loses its other effects. MUST fail StopPausesGoal.
CONSTANT Renew = "AfterDispatch"
CONSTANT AnnounceSurvivesStop = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT StopPausesGoal
