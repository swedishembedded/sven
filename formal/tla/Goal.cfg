\*
\* The kernel as written: it ends the person's turn at rest, continues the
\* goal itself, and lets only the check complete a checked goal. MUST pass,
\* including the liveness that every answer ends.
CONSTANT MachineEndsTurn = TRUE
CONSTANT KernelContinues = TRUE
CONSTANT StopAnytime = FALSE
CONSTANT AnswerIds = TRUE
CONSTANT ReportDecides = FALSE
CONSTANT MaxTurns = 3
CONSTANT MaxInputs = 4
\* A behaviour ends when the person has made their inputs and everything
\* they started has settled: that is a resting session, not a deadlock.
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoGoalTurnUnlessActive
INVARIANT NoWorkAfterTheAnswerEnded
INVARIANT CompletionNeedsAPassingCheck
INVARIANT TurnsWithinBudget
PROPERTY EveryAnswerEnds
