\*
\* Looking for completion only after routing an event, which is what the host
\* did before this model: a child that its own initial transition finished is
\* installed anyway and its completion waits for an unrelated event that may
\* never come. MUST FAIL on TerminalChildIsNotLeftInstalled.
CONSTANT CompleteOnInstall = FALSE
CONSTANT ParentCanLeave = FALSE
CONSTANT ChildStartsDone = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT TerminalChildIsNotLeftInstalled
