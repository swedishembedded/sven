name: CI
run-name: "CI - ${{ github.ref_name }} (${{ github.event_name }})"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: make check

      - name: Tests
        run: make test

  # End-to-end basic tests: CLI, CI mode, mock responses, pipeline.
  e2e-basic:
    name: E2E basic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run basic e2e tests
        run: make test/e2e/basic

  # The browser build: the portable core for wasm32, the same tests natively
  # and as WebAssembly (Node), and a session with a tool in a real headless
  # Chrome's Web Worker (the runner's preinstalled Chrome).
  wasm:
    name: Browser build (wasm32, Node, Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # wasm-bindgen-cli must match the wasm-bindgen the build resolves to.
      - name: Install wasm-bindgen-cli
        run: |
          cargo generate-lockfile
          version="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Check the portable core
        run: make check/wasm

      - name: Test as WebAssembly
        run: make test/wasm

      - name: Test in a real browser
        run: make test/wasm/browser CHROME="$(command -v google-chrome)"

  # Quick smoke-test: make sure we can actually build a release binary.
  # This catches linker / feature-flag issues before a real release.
  build-smoke:
    name: Release build smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: make build/release

  # Portability target: a headless-only build with no
  # TUI and no GDB tools - proves the
  # `minimal` cargo feature profile actually cross-compiles for a real
  # constrained target, not just `cargo check` on the host. aarch64-musl is
  # the chosen target: static libc, no glibc version skew, matches
  # common CI-runner/embedded-gateway hardware.
  minimal-profile:
    name: Minimal profile (aarch64-musl cross build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: xtask arch --profile minimal (forbidden-crate check, host resolution)
        run: cargo run -q -p xtask -- arch --profile minimal

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cross build (--no-default-features --features minimal)
        run: cross build -p sven --no-default-features --features minimal --target aarch64-unknown-linux-musl

  # Cross-platform compilation checks.  These catch ungated Unix-specific code
  # before it blocks a Windows or macOS release build.  Both jobs stay
  # non-blocking until each has one green run on main: the platform gating
  # (D-Bus transport Linux-only, writer lock on every platform) was checked by
  # cross-compiling only, and a failure here is a finding, not noise.  Make a
  # job blocking by deleting its `continue-on-error`.
  check-macos:
    name: cargo check (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace

  check-windows:
    name: cargo check (Windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
