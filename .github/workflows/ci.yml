name: CI
run-name: "CI - ${{ github.ref_name }} (${{ github.event_name }})"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfontconfig-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: make check

      - name: Tests
        run: make test

  # End-to-end basic tests: CLI, CI mode, mock responses, pipeline.
  e2e-basic:
    name: E2E basic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install bats-core and Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats libfontconfig-dev

      - name: Run basic e2e tests
        run: make tests/e2e/basic

  # End-to-end managed-agents platform tests: mock LLM → cloud session →
  # RemoteToolExecutor → companion (loopback + WSS) → metered ledger →
  # statement export, plus the firmware wedge (real gdb-multiarch against an
  # in-process GDB-remote stub).
  e2e-cloud:
    name: E2E cloud platform tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install bats-core, gdb-multiarch and Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats gdb-multiarch libfontconfig-dev

      - name: Run cloud platform e2e tests
        run: make tests/e2e/cloud

  demos:
    name: Deploy demos (hermetic live-binary smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfontconfig-dev

      # Runs the hermetic deploy demos end-to-end against real release binaries
      # (mock LLM, no API keys/hardware): cloud brain→local hands (local-demo,
      # demo-firmware), local brain→remote steer (demo-share), and the normal
      # operator UI over /operator/ws (demo-operator, PORT=18446).
      - name: Run deploy demos
        run: make demos

  # Quick smoke-test: make sure we can actually build a release binary.
  # This catches linker / feature-flag issues before a real release.
  build-smoke:
    name: Release build smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfontconfig-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: make release

  # Cross-platform compilation checks.  These catch ungated Unix-specific code
  # before it blocks a Windows or macOS release build.
  check-macos:
    name: cargo check (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace

  check-windows:
    name: cargo check (Windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace

  # Android client: the CI-critical logic (pairing parser, wire codec,
  # connection state machine, transport client, cert pinning) lives in the
  # pure-JVM :core module — no Android SDK or emulator needed.
  android-core:
    name: Android :core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run :core JVM tests
        run: make android/core
