name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (github.event.inputs.dry_run == 'true'
          && format('Release dry-run ({0})', github.ref_name)
          || format('Release manual ({0})', github.ref_name))
      || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          When true, runs builds, tests, and artifact packaging but does not create
          a GitHub Release. Turn off only if you intend to publish from this ref.
        type: boolean
        default: true

# Read-only for every job: only `publish`, which creates the release, may
# write. Third-party actions and `cross` are pinned to commits, so a moved
# tag cannot change what builds the binaries customers and hosted agents run.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── E2E basic tests (gate before any release artifacts are published) ─────────
  e2e-basic:
    name: E2E basic tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install bats-core and the voice input build dependencies (ALSA, cmake for libopus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats libasound2-dev cmake

      - name: Run basic e2e tests
        run: make test/e2e/basic

  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the voice input build dependencies (ALSA, cmake for libopus)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2-dev cmake

      - name: Release build
        run: make build/release

      - name: Generate shell completions
        run: |
          mkdir -p target/completions
          target/release/sven completions bash > target/completions/sven.bash
          target/release/sven completions zsh  > target/completions/_sven
          target/release/sven completions fish > target/completions/sven.fish

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb --output target/debian/

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/sven      dist/sven-linux-x86_64
          cp target/debian/sven_*.deb dist/sven-linux-x86_64.deb
          # Keep completions as a shared artifact for the arm64 deb build
          cp -r target/completions       dist/completions

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-x86_64
          path: dist/

  # ── Linux, static (musl): x86_64 and aarch64 ────────────────────────────────
  # Binaries with no libc dependency, so they run on any distribution: what
  # install.sh installs on Linux, and what an embedding application runs as hosted agents inside
  # an Alpine gateway (pinned by version and checksum). Both are required.
  build-linux-musl:
    name: Linux ${{ matrix.arch }} (static, musl)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff --locked

      - name: Build static release binary (cross)
        # Static: everything but voice input, whose ALSA cannot be linked
        # statically. The packaged and macOS builds have it.
        run: cross build --release --target ${{ matrix.target }} -p sven --no-default-features --features tui,network,gdb,memory,coding,research,dbus,android

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch != 'x86_64'

      - name: Check it is static and runs without glibc
        run: |
          bin=target/${{ matrix.target }}/release/sven
          file "$bin" | grep -q "static" || { file "$bin"; exit 1; }
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/$bin:/sven:ro" alpine:3.20 /sven --version

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sven dist/sven-linux-${{ matrix.arch }}-musl

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-${{ matrix.arch }}-musl
          path: dist/

  # ── Linux aarch64 ────────────────────────────────────────────────────────────
  # Cross-compiles via `cross` (Docker-based), reuses completions from x86 job.
  # Cross.toml installs `perl` and `pkg-config` in the cross container, for
  # native build scripts (the workspace links no OpenSSL; TLS is rustls).
  # continue-on-error: the x86_64 release is never blocked by an aarch64 failure.
  build-linux-aarch64:
    name: Linux aarch64 [experimental]
    runs-on: ubuntu-24.04
    needs: build-linux-x86_64
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff --locked

      - name: Build release binary (cross)
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Download x86_64 completions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-x86_64
          path: x86-artifacts

      - name: Build .deb package (arm64)
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          bash scripts/build-deb.sh \
            --out-dir target/debian \
            --arch arm64 \
            --binary target/aarch64-unknown-linux-gnu/release/sven \
            --completions-dir x86-artifacts/completions

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/sven dist/sven-linux-aarch64
          cp target/debian/sven_*_arm64.deb                dist/sven-linux-aarch64.deb

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-aarch64
          path: dist/

  # ── macOS universal binary ────────────────────────────────────────────────────
  # Any OpenSSL in the dependency closure is built from source rather than
  # linked against a system library or Homebrew bottle.  This is the only
  # reliable strategy when cross-compiling from the Apple Silicon (aarch64)
  # macos-latest runner to x86_64, because Homebrew does not ship x86_64
  # bottles on that architecture.
  # Required: install.sh installs it on macOS, so a release without it would
  # tell every Mac user there is no build.
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/sven \
            target/aarch64-apple-darwin/release/sven \
            -output dist/sven-darwin-universal

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos
          path: dist/

  # ── Windows x86_64 ───────────────────────────────────────────────────────────
  # continue-on-error: Windows build failures never block the Linux release.
  build-windows:
    name: Windows x86_64 [experimental]
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Release build
        run: cargo build --release

      - name: Stage artifacts
        run: |
          mkdir dist
          copy target\release\sven.exe dist\sven-windows-x86_64.exe

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: dist/

  # ── GitHub Release ────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    # Waits for every build, the experimental glibc aarch64 and Windows ones
    # included: a job not waited for is raced, and its files are simply
    # missing from the release (v4.4.5 shipped without the aarch64 build,
    # which finished two minutes after this job). Their failure still never
    # blocks the release: only e2e-basic (if any basic test fails the
    # release is aborted), the static Linux binaries (install.sh and hosted
    # agents install them), x86_64 and macOS must succeed.
    needs: [e2e-basic, build-linux-x86_64, build-linux-musl, build-macos, build-linux-aarch64, build-windows]
    if: >-
      ${{ !cancelled() &&
          needs.e2e-basic.result == 'success' &&
          needs.build-linux-x86_64.result == 'success' &&
          needs.build-linux-musl.result == 'success' &&
          needs.build-macos.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download x86_64 artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-x86_64
          path: dist

      - name: Download the static (musl) artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: linux-*-musl
          merge-multiple: true
          path: dist

      - name: Download aarch64 artifact (if available)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: linux-aarch64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos
          path: dist

      - name: Download Windows artifact (if available)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: windows
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          # Remove the completions directory (not a release artifact)
          rm -rf completions
          sha256sum sven-* > checksums.txt
          cat checksums.txt

      - name: Dry run - skip GitHub Release
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run: pipeline succeeded; skipping Create GitHub Release."
          echo "Run a real release by pushing a semver tag (v*.*.*) or re-run with dry_run disabled."

      - name: Create GitHub Release
        if: >-
          ${{ !(github.event_name == 'workflow_dispatch' &&
              github.event.inputs.dry_run == 'true') }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
