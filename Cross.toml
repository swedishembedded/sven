# Cross.toml - configuration for `cross` (Docker-based cross-compilation).
#
# The pre-build step installs `perl` and `pkg-config`, which the default cross
# image does not have, for native build scripts. The workspace links no
# OpenSSL: TLS goes through rustls.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends perl pkg-config",
]
