[package]
name        = "sven-document"
version.workspace = true
edition     = "2021"
description = "PDF to Markdown conversion: pure-Rust page rendering and text extraction, per-page OCR through any image-capable ModelProvider, validation, retry, resumable manifest. Services tier."
license     = "Apache-2.0"

[features]
# Fixture PDF builder for tests (here and in the tool crate).
test-support = []

[dependencies]
sven-model  = { path = "../model" }
anyhow      = { workspace = true }
base64      = { workspace = true }
futures     = { workspace = true }
hex         = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
# Pure-Rust rasteriser (Apache-2.0 OR MIT). `embed-fonts` carries the standard
# 14 fonts so pages that name an unembedded Helvetica or Times still render.
hayro       = { version = "0.8", features = ["embed-fonts"] }
# Per-page native text in reading order (MIT), on lopdf.
pdf-extract = "0.12"
# Outline (bookmarks) of a PDF; the parser pdf-extract is built on (MIT).
lopdf       = "0.42"
regex       = { workspace = true }

[dev-dependencies]
tempfile        = { workspace = true }
tokio           = { workspace = true, features = ["test-util", "macros", "rt"] }
image           = { workspace = true }
async-trait     = { workspace = true }
sven-document   = { path = ".", features = ["test-support"] }
