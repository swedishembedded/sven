[package]
name    = "sven-workspace"
version.workspace = true
edition = "2021"

[dependencies]
anyhow     = { workspace = true }
tracing    = { workspace = true }
chrono     = { workspace = true }
serde      = { workspace = true }
serde_yaml = { workspace = true }
dirs       = { workspace = true }
sha2       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# In a browser, chrono reads the clock through JavaScript's Date; its
# default clock panics there.
[target.'cfg(target_arch = "wasm32")'.dependencies.chrono]
workspace = true
features = ["wasmbind"]
