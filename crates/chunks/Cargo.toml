[package]
name        = "sven-chunks"
version.workspace = true
edition     = "2021"
description = "Addressable context: content-addressed raw evidence with provenance, bounded resident memory that spills to disk, staleness against the source file, and deterministic representations of a chunk at four visibilities. Services tier."
license     = "Apache-2.0"

[dependencies]
anyhow     = { workspace = true }
hex        = { workspace = true }
regex      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
