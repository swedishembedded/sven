[package]
name    = "sven-model-drivers"
version.workspace = true
edition = "2021"
description = "Concrete ModelProvider driver implementations (every provider in the driver registry) and the from_config/from_config_probed factory. Owns reqwest and every provider's own dependency closure so sven-model itself doesn't have to."

[dependencies]
sven-config      = { path = "../config" }
sven-model       = { path = "../model" }
sven-model-mock  = { path = "../model-mock" }
anyhow      = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
reqwest     = { workspace = true }
tracing     = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
chrono      = { workspace = true }
dirs        = { workspace = true }

# ── D-Bus transport (optional) ────────────────────────────────────────────────
# brain's `com.swedishembedded.Brain1` interface: the `dbus` model provider and
# the generic action client. Images and audio travel as raw tensors, so the
# transport decodes them itself (sven-image, sven-audio).
zbus       = { version = "5", default-features = false, features = ["tokio"], optional = true }
nix        = { version = "0.29", features = ["mman", "fs"], optional = true }
base64     = { workspace = true, optional = true }
sven-image = { path = "../image", optional = true }
sven-audio = { path = "../sven-audio", optional = true }

[dev-dependencies]
base64 = { workspace = true }
serde_yaml = { workspace = true }
# `p2p` lets the D-Bus provider test serve a fake Brain1.Manager over a plain
# UnixStream pair, with no dbus-daemon and no well-known name involved.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[features]
# Off by default: an assembly that wants `provider: dbus` (or speech
# transcription, which rides the same transport) opts in. Unix only; on other
# targets the provider is refused by name.
dbus = ["dep:zbus", "dep:nix", "dep:base64", "dep:sven-image", "dep:sven-audio"]
