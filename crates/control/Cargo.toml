[package]
name        = "sven-control"
version.workspace = true
edition     = "2021"
description = "Transport-agnostic operator control protocol (ControlCommand/ControlEvent) and its kernel mappings"
license     = "Apache-2.0"

[dependencies]
# The kernel vocabulary the control protocol maps to/from (Event, UiEvent,
# ApprovalId), plus the tool-call vocabulary (ToolSchema) — deliberately no
# libp2p/axum and no sven-tool-registry, so a frontend can depend on the protocol +
# mappings without the heavy node stack or the full tool-registry crate.
sven-hsm    = { path = "../hsm" }
sven-vocab  = { path = "../vocab" }

serde      = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true, features = ["serde", "v4"] }

# A browser has no OS randomness; ids come from its crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
serde_json = { workspace = true }
