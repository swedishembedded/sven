[package]
name        = "sven-control"
version.workspace = true
edition     = "2021"
description = "Transport-agnostic operator control protocol (ControlCommand/ControlEvent) and its kernel mappings, shared by sven-node, sven-cloud and sven-frontend"
license     = "Apache-2.0"

[dependencies]
# The kernel vocabulary the control protocol maps to/from (Event, UiEvent,
# ApprovalId), plus the tool-call vocabulary (ToolSchema) — deliberately no
# libp2p/axum and no sven-tools, so a frontend can depend on the protocol +
# mappings without the heavy node stack or the full tool-registry crate.
sven-hsm    = { path = "../hsm" }
sven-config = { path = "../config" }
sven-vocab  = { path = "../vocab" }

serde      = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true, features = ["serde", "v4"] }
# CBOR codec for the P2P transport (JSON is used over WebSocket).
ciborium   = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
