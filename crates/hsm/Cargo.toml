[package]
name    = "sven-hsm"
version.workspace = true
edition = "2021"
description = "Deterministic Hierarchical State Machine kernel: pure HSM dispatch (Super walk + LCA + entry/exit/init), typed Effects/Events, a permission choke point, event-sourcing replay, and the outward observation broadcast plane. The tokio Active Object runtime that drives it lives in sven-kernel, one tier up. Depends only on sven-vocab (the pure session-event vocabulary), not on any behavioral sven crate."
license = "Apache-2.0"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid        = { workspace = true }
thiserror   = { workspace = true }
# Only the observation bus's broadcast channel: no runtime, timers or I/O,
# so the kernel's pure core also builds for a browser (wasm32).
tokio       = { version = "1", default-features = false, features = ["sync"] }
sven-vocab  = { path = "../vocab" }

# A browser has no OS randomness; ids come from its crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid        = { workspace = true, features = ["js"] }

[dev-dependencies]
tokio       = { workspace = true }
serde_json  = { workspace = true }
