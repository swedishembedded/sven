[package]
name        = "sven-remote"
version.workspace = true
edition     = "2021"
description = "Remote control: sign a host in to a remote-control server and run many agent sessions on this machine for it (`sven auth login`, `sven rc`)"
license     = "Apache-2.0"

[dependencies]
sven-bootstrap     = { path = "../bootstrap", default-features = false }
sven-control       = { path = "../control" }
sven-executors     = { path = "../executors" }
sven-frontend      = { path = "../frontend" }
sven-hsm           = { path = "../hsm" }
sven-machines      = { path = "../machines" }
sven-model         = { path = "../model" }
sven-model-drivers = { path = "../model-drivers" }
sven-session-sync  = { path = "../session-sync" }
sven-tool-api      = { path = "../tool-api" }
sven-tools-agent   = { path = "../tools-agent" }
sven-vocab         = { path = "../vocab" }
async-trait        = { workspace = true }
anyhow     = { workspace = true }
base64     = { workspace = true }
dirs       = { workspace = true }
futures    = { workspace = true }
libc       = { workspace = true }
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
