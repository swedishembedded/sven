[package]
name    = "sven-frontend"
version.workspace = true
edition = "2021"
description = "Shared agent-wiring layer for sven frontends: the session controller the TUI, headless and ACP surfaces open their sessions through, and the whole configuration file"
license = "Apache-2.0"

[dependencies]
sven-config      = { path = "../config" }
sven-commands    = { path = "../commands" }
sven-model       = { path = "../model" }
sven-model-drivers = { path = "../model-drivers" }
sven-session-store       = { path = "../session-store" }
sven-session-model = { path = "../session-model" }
sven-tool-api    = { path = "../tool-api" }
sven-tool-registry = { path = "../tool-registry" }
sven-tools-agent = { path = "../tools-agent" }
sven-machines        = { path = "../machines" }
sven-vocab       = { path = "../vocab" }
sven-hsm         = { path = "../hsm" }
sven-bootstrap   = { path = "../bootstrap", default-features = false }
sven-mcp-client  = { path = "../mcp-client" }
sven-workspace     = { path = "../workspace" }
# Transport-agnostic control protocol + kernel mappings (no transport deps).
sven-control     = { path = "../control" }
anyhow           = { workspace = true }
tokio            = { workspace = true }
futures          = { workspace = true }
tracing          = { workspace = true }
serde_json       = { workspace = true }
serde            = { workspace = true }
uuid             = { workspace = true }
base64           = { workspace = true }
chrono           = { workspace = true }
unicode-width    = { workspace = true }
rustls           = { workspace = true }
rand             = "0.8"
pulldown-cmark   = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tungstenite       = { version = "0.24", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
sven-model-mock = { path = "../model-mock" }
