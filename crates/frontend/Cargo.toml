[package]
name    = "sven-frontend"
version.workspace = true
edition = "2021"
description = "Shared agent-wiring layer for sven frontends (TUI)"
license = "Apache-2.0"

[dependencies]
sven-config      = { path = "../config" }
sven-commands    = { path = "../commands" }
sven-model       = { path = "../model" }
sven-model-drivers = { path = "../model-drivers" }
sven-session-store       = { path = "../session-store" }
sven-session-model = { path = "../session-model" }
sven-tools       = { path = "../tools" }
sven-tools-fs    = { path = "../tools-fs" }
sven-machines        = { path = "../machines" }
sven-bootstrap   = { path = "../bootstrap" }
sven-hsm         = { path = "../hsm" }
sven-mcp-client  = { path = "../mcp-client" }
sven-workspace     = { path = "../workspace" }
# Transport-agnostic control protocol + kernel mappings (NO libp2p/axum) — the
# one-tap `/share` bridge reuses these instead of depending on sven-node.
sven-control     = { path = "../control" }
# The `/share` sub-protocol frames (ShareRegister / ShareFrame).
sven-wire        = { path = "../wire" }
# WS client used to dial the broker's `/share` endpoint (bearer auth + CA trust).
sven-node-client = { path = "../sven-node-client" }
anyhow           = { workspace = true }
tokio            = { workspace = true }
futures          = { workspace = true }
tracing          = { workspace = true }
serde_json       = { workspace = true }
serde            = { workspace = true }
uuid             = { workspace = true }
base64           = { workspace = true }
chrono           = { workspace = true }
unicode-width    = { workspace = true }
rustls           = { workspace = true }
rand             = "0.8"
pulldown-cmark   = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tungstenite       = { version = "0.24", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
sven-model-mock = { path = "../model-mock" }
