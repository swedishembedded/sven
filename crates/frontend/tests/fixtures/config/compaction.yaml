# docs/05-configuration.md and docs/technical/prompt-compaction.md: tuning
# compaction and the thinking watchdog.
agent:
  compaction_threshold: 0.80
  compaction_overhead_reserve: 0.12
  tool_result_token_cap: 2000   # tighter cap for CI workloads
  compaction_strategy: narrative
  compaction_keep_recent: 10
  max_thinking_tokens: 20000
  thinking_timeout_secs: 300
  stream_idle_timeout_secs: 600
  child_run_timeout_secs: 900
  max_step_timeout_secs: 120
  max_run_timeout_secs: 3600
  default_mode: research
  system_prompt: "You are a careful coding assistant."
