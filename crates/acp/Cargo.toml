[package]
name        = "sven-acp"
version.workspace = true
edition     = "2021"
description = "ACP (Agent Client Protocol) server for sven - exposes sven as an ACP-compliant agent"
license     = "Apache-2.0"

[[bin]]
name = "sven-acp"
path = "src/bin/sven-acp.rs"

[dependencies]
sven-machines        = { path = "../machines" }
sven-tool-api    = { path = "../tool-api" }
sven-hsm         = { path = "../hsm" }
sven-bootstrap   = { path = "../bootstrap" }
sven-config      = { path = "../config" }
sven-model       = { path = "../model" }
anyhow           = { workspace = true }
clap             = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
uuid             = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
agent-client-protocol = { version = "0.10", features = ["unstable_session_usage"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util       = { version = "0.7", features = ["compat"] }
rustls           = { workspace = true }
futures-util     = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio  = { workspace = true }
tempfile = { workspace = true }
