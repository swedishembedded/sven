[package]
name    = "sven-bootstrap"
version.workspace = true
edition = "2021"

[dependencies]
sven-config        = { path = "../config" }
sven-model         = { path = "../model" }
sven-model-drivers = { path = "../model-drivers" }
sven-tool-api      = { path = "../tool-api" }
sven-tool-registry = { path = "../tool-registry" }
sven-tools-fs      = { path = "../tools-fs", default-features = false }
sven-tools-exec    = { path = "../tools-exec" }
sven-tools-ctx     = { path = "../tools-ctx" }
sven-tools-agent   = { path = "../tools-agent" }
sven-tools-web     = { path = "../tools-web" }
sven-tools-android = { path = "../tools-android", optional = true }
sven-machines          = { path = "../machines" }
sven-turn              = { path = "../turn" }
sven-workspace       = { path = "../workspace" }
sven-mcp-client    = { path = "../mcp-client" }
sven-hsm           = { path = "../hsm" }
sven-vocab         = { path = "../vocab" }
# Always linked for the `tools.gdb` configuration section; the tools themselves
# are the `gdb` feature, Unix only.
sven-tools-gdb     = { path = "../tools-gdb", default-features = false }
sven-kernel        = { path = "../kernel" }
sven-executors     = { path = "../executors" }
# New integration crates - optional at bootstrap level
sven-memory        = { path = "../memory", optional = true }
anyhow       = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
serde         = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
uuid         = { workspace = true }
tokio-util   = { version = "0.7", features = ["compat"] }
tracing      = { workspace = true }
agent-client-protocol = { version = "0.10", features = ["unstable_session_usage"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[features]
# What `default-features = false` leaves is the minimal assembly: the kernel,
# the machines, every model provider that speaks HTTP, and the plain-text tool
# set (files, search, shell, web, memory file, skills, todo, sub-agents). No
# D-Bus, no image or audio decoding, no Android device control.
default = ["coding", "research", "dbus", "android", "gdb", "memory"]

# ── Presets: what the matching `BuiltinTools` profile uses ──────────────────
# `coding`: attach images and audio (`attach_file`), read images, transcribe
# audio for a model that cannot hear.
coding = ["media", "asr"]
# `research`: read images and diagrams.
research = ["media"]

# ── Capabilities ────────────────────────────────────────────────────────────
# Image and audio decoding: `attach_file` and images in `read_file`.
media = ["sven-tools-fs/media"]
# Speech-to-text over brain's D-Bus action surface (Unix only).
asr = ["media", "dbus", "sven-tools-fs/asr"]
# `provider: dbus`, brain's D-Bus model transport (Unix only).
dbus = ["sven-model-drivers/dbus"]
# Android device control: the `android` tool, the `ui-test` mode that drives
# it (registered by `mode_registry`, never listed without it) and the
# agent-dispatch `ui_test_dispatch` entry point.
android = ["dep:sven-tools-android"]
# Semantic memory (SQLite + FTS5 `semantic_memory` tool). Its own feature
# because `rusqlite` is in xtask's
# FORBIDDEN_IN_MINIMAL list (`xtask/src/main.rs`) - the `minimal` build must
# be able to exclude it while every other default build keeps it on.
memory = ["dep:sven-memory"]
# GDB/MI debugging tools (unix only regardless of this flag - see the
# target-gated dependency below). Kept separately toggleable so a portable
# headless build can exclude gdbmi and its transitive closure entirely.
gdb = ["sven-tools-gdb/mi"]

[dev-dependencies]
serde_yaml = { workspace = true }
tempfile = { workspace = true }
sven-model-mock = { path = "../model-mock" }
