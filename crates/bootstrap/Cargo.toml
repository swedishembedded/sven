[package]
name    = "sven-bootstrap"
version.workspace = true
edition = "2021"

[dependencies]
sven-config        = { path = "../config" }
sven-model         = { path = "../model" }
sven-model-drivers = { path = "../model-drivers" }
sven-tools         = { path = "../tools" }
sven-tools-fs      = { path = "../tools-fs" }
sven-tools-exec    = { path = "../tools-exec" }
sven-tools-ctx     = { path = "../tools-ctx" }
sven-tools-agent   = { path = "../tools-agent" }
sven-tools-web     = { path = "../tools-web" }
sven-tools-android = { path = "../tools-android" }
sven-machines          = { path = "../machines" }
sven-workspace       = { path = "../workspace" }
sven-mcp-client    = { path = "../mcp-client" }
sven-hsm           = { path = "../hsm" }
sven-kernel        = { path = "../kernel" }
sven-executors     = { path = "../executors" }
sven-llm           = { path = "../llm" }
sven-vocab         = { path = "../vocab" }
# New integration crates - optional at bootstrap level
sven-channels      = { path = "../channels", optional = true }
sven-scheduler     = { path = "../scheduler", optional = true }
sven-integrations  = { path = "../integrations", optional = true }
sven-memory        = { path = "../memory", optional = true }
anyhow       = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
uuid         = { workspace = true }
tokio-util   = { version = "0.7", features = ["compat"] }
tracing      = { workspace = true }
agent-client-protocol = { version = "0.10", features = ["unstable_session_usage"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[features]
default = ["gdb", "memory"]
# Enable all integration tools at once
integrations = [
    "dep:sven-channels",
    "dep:sven-scheduler",
    "dep:sven-integrations",
]
# Semantic memory (SQLite + FTS5 `semantic_memory` tool). Split out of the
# `integrations` bundle above because `rusqlite` is in xtask's
# FORBIDDEN_IN_MINIMAL list (`xtask/src/main.rs`) - the `minimal` build must
# be able to exclude it while every other default build keeps it on.
memory = ["dep:sven-memory"]
# GDB/MI debugging tools (unix only regardless of this flag - see the
# target-gated dependency below). Kept separately toggleable so a portable
# headless build can exclude gdbmi and its transitive closure entirely.
gdb = ["dep:sven-tools-gdb"]

[target.'cfg(unix)'.dependencies]
sven-tools-gdb = { path = "../tools-gdb", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
sven-model-mock = { path = "../model-mock" }
