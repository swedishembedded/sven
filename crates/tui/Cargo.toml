[package]
name    = "sven-tui"
version.workspace = true
edition = "2021"

[features]
default = ["voice"]
# Voice dictation (Ctrl+G): microphone capture (cpal, which needs the ALSA
# headers on Linux), Ogg/Opus encoding (libopus, built with cmake) and the
# transcription request. Without it Ctrl+G only says the build has none.
voice = ["dep:cpal", "dep:opus", "dep:ogg", "dep:sven-audio"]

[dependencies]
sven-vocab     = { path = "../vocab" }
sven-model     = { path = "../model" }
sven-model-drivers = { path = "../model-drivers" }
sven-session-store     = { path = "../session-store" }
sven-tool-api  = { path = "../tool-api" }
sven-tool-registry = { path = "../tool-registry" }
sven-tools-fs  = { path = "../tools-fs" }
sven-tools-agent = { path = "../tools-agent" }
sven-machines      = { path = "../machines" }
sven-turn          = { path = "../turn" }
sven-bootstrap = { path = "../bootstrap" }
sven-mcp-client = { path = "../mcp-client" }
sven-config     = { path = "../config" }
sven-workspace   = { path = "../workspace" }
sven-frontend  = { path = "../frontend" }
sven-tui-nvim  = { path = "../tui-nvim" }
atif           = { path = "../atif" }
anyhow      = { workspace = true }
serde_yaml  = { workspace = true }
tokio       = { workspace = true }
futures     = { workspace = true }
tracing     = { workspace = true }
ratatui     = { workspace = true }
crossterm   = { workspace = true }
unicode-width = { workspace = true }
pulldown-cmark = { workspace = true }
regex       = { workspace = true }
syntect     = { workspace = true }
serde_json  = { workspace = true }
serde       = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
base64      = { workspace = true }
rand        = "0.8"
notify       = { workspace = true }
cpal         = { version = "0.16", optional = true }
opus         = { version = "0.4", optional = true }
ogg          = { version = "0.9", optional = true }
sven-audio   = { path = "../sven-audio", optional = true }

[dev-dependencies]
tempfile     = { workspace = true }
