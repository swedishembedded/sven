[package]
name    = "sven-model-catalog"
version.workspace = true
edition = "2021"
description = "The cache of what model endpoints serve (limits, modalities, prices), in memory and on local disk. No I/O beyond local disk cache reads/writes; no reqwest, no cloud SDKs."

[dependencies]
sven-rt    = { path = "../rt" }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
dirs       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
