[package]
name        = "sven-tools-ctx"
version.workspace = true
edition     = "2021"
description = "Context/reference tools: the memory-mapped RLM context store (context_open/context_read/context_grep), project knowledge (list_knowledge/search_knowledge), and the compound memory tool. Domain tier. Split out of sven-tools's builtin/context/ + builtin/knowledge/ (5.4 of the refactor plan's god-crate splits), with search_knowledge and builtin/system/memory.rs pulled in from their literal directory locations to follow their real SharedKnowledge/ListKnowledgeTool/SearchKnowledgeTool coupling instead."
license     = "Apache-2.0"

[dependencies]
sven-tool-api  = { path = "../tool-api" }
sven-config    = { path = "../config" }
sven-hsm       = { path = "../hsm" }
sven-workspace = { path = "../workspace" }
anyhow         = { workspace = true }
async-trait    = { workspace = true }
dirs           = { workspace = true }
memmap2        = { workspace = true }
regex          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
