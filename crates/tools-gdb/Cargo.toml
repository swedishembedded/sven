[package]
name        = "sven-tools-gdb"
version.workspace = true
edition     = "2021"
description = "GDB/MI debugging tools (connect, start-server, command, interrupt, stop, wait-stopped, and the compound GdbTool dispatcher), plus GDB-server-binary discovery. Domain tier. Unix only -- GDB signal APIs are not available on Windows."
license     = "Apache-2.0"

[dependencies]
sven-tool-api = { path = "../tool-api" }
sven-tool-registry = { path = "../tool-registry" }
sven-config   = { path = "../config" }
sven-hsm      = { path = "../hsm" }
sven-vocab    = { path = "../vocab" }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
regex         = { workspace = true }
libc          = { workspace = true }

# The GDB/MI client: what the `mi` feature adds. Without it the crate holds
# only the `tools.gdb` configuration section, so a build that leaves the tools
# out still reads a configuration file that names the section.
[target.'cfg(unix)'.dependencies]
gdbmi = { version = "0.0.2", optional = true }

[features]
default = ["mi"]
# The GDB tools themselves (Unix only -- GDB signal APIs are not available on
# Windows, where enabling this feature adds nothing).
mi = ["dep:gdbmi"]

[[test]]
name = "gdb_integration"
required-features = ["mi"]

[dev-dependencies]
serde_yaml = { workspace = true }
tempfile = { workspace = true }
