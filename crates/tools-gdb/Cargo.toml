[package]
name        = "sven-tools-gdb"
version.workspace = true
edition     = "2021"
description = "GDB/MI debugging tools (connect, start-server, command, interrupt, stop, wait-stopped, and the compound GdbTool dispatcher), plus GDB-server-binary discovery. Domain tier. Unix only -- GDB signal APIs are not available on Windows."
license     = "Apache-2.0"

[dependencies]
sven-tool-api = { path = "../tool-api" }
sven-tool-registry = { path = "../tool-registry" }
sven-config   = { path = "../config" }
sven-hsm      = { path = "../hsm" }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
regex         = { workspace = true }
# This whole crate is Unix only (GDB signal APIs are not available on
# Windows), so it has no non-unix code path to protect -- every
# consumer already gates its `sven-tools-gdb` dependency itself under
# `target.'cfg(unix)'.dependencies` (see crates/bootstrap/Cargo.toml), so
# these can be plain, unconditional dependencies here.
libc  = { workspace = true }
gdbmi = "0.0.2"

[dev-dependencies]
tempfile = { workspace = true }
