[package]
name    = "sven-frontend"
version = "0.2.0"
edition = "2021"
description = "Shared agent-wiring layer for sven frontends (TUI and GUI)"
license = "Apache-2.0"

[dependencies]
sven-config      = { path = "../sven-config" }
sven-model       = { path = "../sven-model" }
sven-input       = { path = "../sven-input" }
sven-tools       = { path = "../sven-tools" }
sven-core        = { path = "../sven-core" }
sven-bootstrap   = { path = "../sven-bootstrap" }
sven-hsm         = { path = "../sven-hsm" }
sven-executors   = { path = "../sven-executors" }
sven-mcp-client  = { path = "../sven-mcp-client" }
sven-runtime     = { path = "../sven-runtime" }
# Transport-agnostic control protocol + kernel mappings (NO libp2p/axum) — the
# one-tap `/share` bridge reuses these instead of depending on sven-node.
sven-control     = { path = "../sven-control" }
# The `/share` sub-protocol frames (ShareRegister / ShareFrame).
sven-wire        = { path = "../sven-wire" }
# WS client used to dial the broker's `/share` endpoint (bearer auth + CA trust).
sven-node-client = { path = "../sven-node-client" }
anyhow           = { workspace = true }
tokio            = { workspace = true }
futures          = { workspace = true }
tracing          = { workspace = true }
serde_json       = { workspace = true }
serde            = { workspace = true }
uuid             = { workspace = true }
base64           = { workspace = true }
chrono           = { workspace = true }
unicode-width    = { workspace = true }
rustls           = { workspace = true }
rand             = "0.8"
pulldown-cmark   = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tungstenite       = { version = "0.24", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
