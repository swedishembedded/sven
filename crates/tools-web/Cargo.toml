[package]
name        = "sven-tools-web"
version.workspace = true
edition     = "2021"
description = "Information-gathering tools: internet fetch/search (web_fetch, web_search) and read-only codebase diagnostics that shell out to an external binary (grep, search_codebase, read_lints). Domain tier. Split out of sven-tools's builtin/web/ + builtin/search/{grep,search_codebase}.rs + builtin/system/read_lints.rs (5.5 of the refactor plan's god-crate splits)."
license     = "Apache-2.0"

[dependencies]
sven-tool-api = { path = "../tool-api" }
sven-hsm      = { path = "../hsm" }
sven-vocab    = { path = "../vocab" }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
reqwest       = { workspace = true }
html2text     = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
