[package]
name        = "sven-tools-web"
version.workspace = true
edition     = "2021"
description = "Information-gathering tools: internet fetch/search (web_fetch, web_search) and read-only codebase diagnostics that shell out to an external binary (grep, read_lints). Domain tier."
license     = "Apache-2.0"

[dependencies]
sven-tool-api = { path = "../tool-api" }
sven-hsm      = { path = "../hsm" }
sven-vocab    = { path = "../vocab" }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
reqwest       = { workspace = true }
html2text     = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
