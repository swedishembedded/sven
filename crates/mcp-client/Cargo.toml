[package]
name        = "sven-mcp-client"
version.workspace = true
edition     = "2021"
description = "MCP client for sven - connects to external MCP servers as a tool/prompt/resource source"
license     = "Apache-2.0"

[dependencies]
sven-config   = { path = "../config" }
sven-tool-api = { path = "../tool-api" }

anyhow       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
reqwest      = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
dirs         = { workspace = true }
sha2         = { workspace = true }
url          = "2.5"
webbrowser   = "1"
rmcp         = { workspace = true, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
fs4          = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }
tempfile   = "3"
rmcp       = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
# A server of the previous protocol era, for the conformance suite only.
legacy     = { package = "rmcp", version = "=0.15.0", default-features = false, features = ["server", "transport-io"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }

# Its own main: the binary is also the stdio servers it tests against.
[[test]]
name    = "conformance"
harness = false
