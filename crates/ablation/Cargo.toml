[package]
name        = "sven-ablation"
version.workspace = true
edition     = "2021"
publish     = false
description = "Ablation benchmark suite: the variant matrix, the decision providers that stand in for a model, seeded task generators with objective scorers, the runner and the report. Development tooling, not part of the product."
license     = "Apache-2.0"

[dependencies]
sven-decision = { path = "../decision" }
sven-vocab    = { path = "../vocab" }
async-trait   = { workspace = true }
clap          = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
serde_yaml    = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }

[[bin]]
name = "sven-ablation"
path = "src/main.rs"

[dev-dependencies]
sven-model      = { path = "../model" }
sven-model-mock = { path = "../model-mock" }
futures         = { workspace = true }
regex           = { workspace = true }
sven-chunks     = { path = "../chunks" }
tempfile        = { workspace = true }
