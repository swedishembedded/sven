[package]
name        = "sven-harness-testkit"
version.workspace = true
edition     = "2021"
description = "Offline test runner and comparer for sven harnesses (mock models unless explicitly opted in)"
license     = "Apache-2.0"

[dependencies]
sven-sdk        = { path = "../sdk", default-features = false }
sven-harness-spec = { path = "../harness-spec" }
sven-harness-runtime = { path = "../harness-runtime" }
sven-model-mock = { path = "../model-mock" }
anyhow          = { workspace = true }
async-trait     = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
serde_yaml      = { workspace = true }
tempfile        = { workspace = true }
thiserror       = { workspace = true }
tokio           = { workspace = true }
