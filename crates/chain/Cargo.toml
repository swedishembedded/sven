[package]
name        = "sven-chain"
version.workspace = true
edition     = "2021"
description = "Hash-chained append-only JSONL log: the sha256 chain primitives shared by the audit executor and the metering credit ledger. Zero dependencies on other sven crates."
license     = "Apache-2.0"

[dependencies]
chrono     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
