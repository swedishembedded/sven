[package]
name    = "sven-memory"
version.workspace = true
edition = "2021"
description = "Semantic (vector + BM25) memory store for sven agents"

[dependencies]
sven-tools   = { path = "../tools" }
# The learning submitter is selected by config value (`local`, `none`, and a
# remote one later), so the config->submitter factory lives beside the
# submitters rather than being re-derived at every call site. domain ->
# foundation, the same edge the other tool crates take for their own settings.
sven-config  = { path = "../config" }
sven-vocab   = { path = "../vocab" }
sven-chain   = { path = "../chain" }

anyhow       = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
dirs         = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
reqwest      = { workspace = true }
sha2         = { workspace = true }
shellexpand  = { workspace = true }
hex          = { workspace = true }

# SQLite for persistent memory storage with FTS5
rusqlite     = { version = "0.31", features = ["bundled", "load_extension"] }

[dev-dependencies]
tokio    = { workspace = true }
tempfile = { workspace = true }
