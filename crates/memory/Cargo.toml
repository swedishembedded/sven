[package]
name    = "sven-memory"
version.workspace = true
edition = "2021"
description = "Semantic (vector + BM25) memory store for sven agents"

[dependencies]
sven-tools   = { path = "../tools" }
# The learning submitter is selected by config value (`local`, `none`, and a
# remote one later), so the config->submitter factory lives beside the
# submitters rather than being re-derived at every call site. domain ->
# foundation, the same edge the other tool crates take for their own settings.
sven-config  = { path = "../config" }
sven-vocab   = { path = "../vocab" }
sven-chain   = { path = "../chain" }
# QuestionId/ToolCallId for the parked-question ledger - domain -> foundation,
# the same edge sven-vocab/sven-chain already take.
sven-hsm     = { path = "../hsm" }
# The ATIF trajectory format itself (foundation tier) and the reward-stamping
# wire contract built on it (services tier) - both legal downward edges from
# domain. Used by `trajectory_export` to turn a session's own recorded runs
# into brain's training-chat format.
atif             = { path = "../atif" }
sven-session-store = { path = "../session-store" }

anyhow       = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
dirs         = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
reqwest      = { workspace = true }
sha2         = { workspace = true }
shellexpand  = { workspace = true }
hex          = { workspace = true }

# SQLite for persistent memory storage with FTS5
rusqlite     = { version = "0.31", features = ["bundled", "load_extension"] }

[dev-dependencies]
tokio    = { workspace = true }
tempfile = { workspace = true }
