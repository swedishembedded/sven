[package]
name    = "sven-memory"
version.workspace = true
edition = "2021"
description = "Semantic (vector + BM25) memory store for sven agents"

[dependencies]
sven-tool-api = { path = "../tool-api" }
sven-vocab   = { path = "../vocab" }
sven-chain   = { path = "../chain" }
# QuestionId/ToolCallId for the parked-question ledger - domain -> foundation,
# the same edge sven-vocab/sven-chain already take.
sven-hsm     = { path = "../hsm" }

anyhow       = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
dirs         = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }

# SQLite for persistent memory storage with FTS5
rusqlite     = { version = "0.31", features = ["bundled", "load_extension"] }

[dev-dependencies]
tokio    = { workspace = true }
tempfile = { workspace = true }
