[package]
name    = "sven-turn"
version.workspace = true
edition = "2021"

[dependencies]
sven-model  = { path = "../model" }
sven-tool-api = { path = "../tool-api" }
sven-tool-registry = { path = "../tool-registry" }
sven-workspace = { path = "../workspace" }
sven-vocab  = { path = "../vocab" }
sven-session-model = { path = "../session-model" }
sven-chunks = { path = "../chunks" }
anyhow      = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
regex       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio       = { workspace = true }

# In a browser a turn runs on the kernel's portable runtime (the page's event
# loop and timers); tokio only for its channels and select!.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio       = { version = "1", default-features = false, features = ["sync", "macros"] }
sven-kernel = { path = "../kernel" }

[dev-dependencies]
# Paused time, so the idle-timeout test does not wait in real time.
tokio       = { workspace = true, features = ["test-util"] }
sven-model-mock = { path = "../model-mock" }
sven-model-drivers = { path = "../model-drivers" }
