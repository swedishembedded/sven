[package]
name    = "sven-gui"
version.workspace = true
edition = "2021"
description = "Slint-based desktop GUI widgets and bridge for Sven"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
sven-frontend = { path = "../frontend" }
sven-config   = { path = "../config" }
sven-core     = { path = "../core" }
sven-tools    = { path = "../tools" }
sven-input    = { path = "../input" }
sven-model    = { path = "../model" }
sven-bootstrap = { path = "../bootstrap" }
sven-runtime  = { path = "../runtime" }
sven-mcp-client = { path = "../mcp-client" }
trace         = { path = "../trace" }
slint         = { workspace = true }
tokio         = { workspace = true }
futures       = { workspace = true }
tracing       = { workspace = true }
anyhow        = { workspace = true }
serde_json    = { workspace = true }
chrono        = { workspace = true }
uuid          = { workspace = true }
syntect       = { workspace = true }
pulldown-cmark = { workspace = true }
[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
serde_yaml   = { workspace = true }
