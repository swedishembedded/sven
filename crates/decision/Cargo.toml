[package]
name        = "sven-decision"
version.workspace = true
edition     = "2021"
description = "The decision runtime: typed questions a harness asks a small non-generative decision model, the policy that accepts or abstains from its answer, and the transport to a model provider. Services tier."
license     = "Apache-2.0"

[dependencies]
sven-config = { path = "../config" }
async-trait = { workspace = true }
lru         = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
sven-vocab  = { path = "../vocab" }
thiserror   = { workspace = true }
sven-rt     = { path = "../rt" }

[dev-dependencies]
serde_yaml = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio       = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio       = { version = "1", default-features = false, features = ["sync"] }
