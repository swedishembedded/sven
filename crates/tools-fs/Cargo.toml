[package]
name        = "sven-tools-fs"
version.workspace = true
edition     = "2021"
description = "Filesystem tools: direct file read/write/edit/find/attach (file/) and the streaming subprocess-output buffer tools (buffer/). Domain tier."
license     = "Apache-2.0"

[dependencies]
sven-tool-api = { path = "../tool-api" }
sven-config   = { path = "../config" }
sven-hsm      = { path = "../hsm" }
sven-vocab    = { path = "../vocab" }
sven-model    = { path = "../model" }
# `media`: image and audio decoding.
sven-image    = { path = "../image", optional = true }
sven-audio    = { path = "../sven-audio", optional = true }
# `asr`: speech-to-text dials brain's generic action surface over D-Bus.
sven-model-drivers = { path = "../model-drivers", optional = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
regex         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
similar       = { workspace = true }
tempfile      = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
walkdir       = { workspace = true }

[features]
default = ["media"]
# Images and audio: `read_file` returns an image as a data URL, and the
# `attach_file` tool / `load_attachment` attach images and audio.
media = ["dep:sven-image", "dep:sven-audio"]
# Transcribing audio for a model that cannot take it, over brain's D-Bus action
# surface (Unix only). Without it such audio is refused with the reason.
asr = ["media", "dep:sven-model-drivers", "sven-model-drivers/dbus"]

[dev-dependencies]
serde_yaml = { workspace = true }
sven-model-mock = { path = "../model-mock" }
# A fake `Brain1.Manager` served over a plain `UnixStream` pair, so the
# transcription path is exercised with no bus daemon, no server and no
# checkpoint. `p2p` is what makes a connection with no well-known name legal.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
