[package]
name        = "sven-tools-fs"
version.workspace = true
edition     = "2021"
description = "Filesystem tools: direct file read/write/edit/find/attach (file/) and the streaming subprocess-output buffer tools (buffer/). Domain tier."
license     = "Apache-2.0"

[dependencies]
sven-tool-api = { path = "../tool-api" }
sven-config   = { path = "../config" }
sven-hsm      = { path = "../hsm" }
sven-image    = { path = "../image" }
sven-audio    = { path = "../sven-audio" }
sven-model    = { path = "../model" }
# Speech-to-text dials brain's generic action surface over D-Bus.
sven-model-drivers = { path = "../model-drivers", features = ["dbus"] }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
regex         = { workspace = true }
serde_json    = { workspace = true }
similar       = { workspace = true }
tempfile      = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
walkdir       = { workspace = true }

[dev-dependencies]
sven-model-mock = { path = "../model-mock" }
# A fake `Brain1.Manager` served over a plain `UnixStream` pair, so the
# transcription path is exercised with no bus daemon, no server and no
# checkpoint. `p2p` is what makes a connection with no well-known name legal.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
