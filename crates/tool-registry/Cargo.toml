[package]
name        = "sven-tool-registry"
version.workspace = true
edition     = "2021"
description = "The concrete tool registry: ToolRegistry (lookup/execute/schema listing, MCP hot-swap, approval gating), plus the config-driven policy engine that decides an ApprovalPolicy for a command (ToolPolicy). Services tier: builds on sven-tool-api's trait/type vocabulary."
license     = "Apache-2.0"

[dependencies]
sven-tool-api  = { path = "../tool-api" }
sven-config    = { path = "../config" }
sven-hsm       = { path = "../hsm" }
sven-workspace = { path = "../workspace" }
sven-vocab     = { path = "../vocab" }
regex          = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
tokio      = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
