[package]
name    = "sven-model"
version.workspace = true
edition = "2021"

[features]
default = ["dbus"]
# The D-Bus model transport (brain's `com.swedishembedded.Brain1` interface).
# Unix-only; the module is compiled away entirely on other platforms.
dbus = ["dep:zbus", "dep:nix"]

[dependencies]
sven-config = { path = "../config" }
sven-image  = { path = "../image" }
sven-audio  = { path = "../sven-audio" }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
reqwest     = { workspace = true }
tracing     = { workspace = true }
serde_yaml  = { workspace = true }
regex       = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
chrono      = { workspace = true }
dirs        = { workspace = true }
base64      = { workspace = true }

# ── D-Bus transport (optional) ────────────────────────────────────────────────
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
nix  = { version = "0.29", features = ["mman", "fs"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# `p2p` lets the D-Bus provider test serve a fake Brain1.Manager over a plain
# UnixStream pair, with no dbus-daemon and no well-known name involved.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
