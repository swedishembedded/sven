[package]
name        = "sven-mcp"
version.workspace = true
edition     = "2021"
description = "MCP server for sven - exposes sven tools to any MCP client"
license     = "MIT"

[[bin]]
name = "sven-mcp"
path = "src/bin/sven-mcp.rs"

[dependencies]
sven-bootstrap       = { path = "../bootstrap", default-features = false }
sven-tool-api        = { path = "../tool-api" }
sven-tool-registry   = { path = "../tool-registry" }
sven-tools-fs        = { path = "../tools-fs" }
sven-tools-web       = { path = "../tools-web" }
sven-mcp-client      = { path = "../mcp-client" }
sven-config          = { path = "../config" }
serde_yaml           = { workspace = true }
anyhow               = { workspace = true }
clap                 = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
tokio                = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
uuid                 = { workspace = true }
tokio-tungstenite    = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls               = { workspace = true }
futures-util         = { version = "0.3", default-features = false, features = ["sink", "std"] }
rmcp = { workspace = true, features = ["server", "transport-io"] }

[dev-dependencies]
tempfile     = { workspace = true }
tokio        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io", "client"] }
