[package]
name    = "sven-sdk-macros"
version.workspace = true
edition = "2021"
description = "The #[agent] attribute macro: a Rust trait whose documentation is its prompt"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full", "extra-traits"] }
