[package]
name    = "sven-sdk"
version.workspace = true
edition = "2021"
description = "The public Sven framework: engines, agent objects, and typed model-driven methods"
license = "Apache-2.0"

[dependencies]
sven-bootstrap = { path = "../bootstrap", default-features = false }
sven-harness-runtime = { path = "../harness-runtime", features = ["transform"] }
sven-harness-spec = { path = "../harness-spec" }
sven-hsm       = { path = "../hsm" }
sven-machines  = { path = "../machines" }
sven-model     = { path = "../model" }
sven-model-drivers = { path = "../model-drivers" }
sven-tool-api  = { path = "../tool-api" }
sven-sdk-macros = { path = "../sdk-macros" }
sven-session-model = { path = "../session-model" }
sven-session-store = { path = "../session-store" }
atif           = { path = "../atif" }
sven-chain     = { path = "../chain" }
sven-vocab     = { path = "../vocab" }
sven-workspace = { path = "../workspace" }
anyhow         = { workspace = true }
schemars       = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
serde_yaml     = { workspace = true }
thiserror      = { workspace = true }
uuid           = { workspace = true }
tokio          = { workspace = true }

[features]
# The presets mirror `Toolset::coding()` / `Toolset::research()`: each compiles
# in what that toolset's tools need. `dbus` is brain's D-Bus model transport;
# `android` the `android` tool and the `ui-test` mode that drives it.
# `default-features = false` is the minimal SDK: no D-Bus, no image or audio
# decoding, no Android device control, and no `ui-test` mode.
default = ["coding", "research", "dbus", "android"]
coding = ["sven-bootstrap/coding"]
research = ["sven-bootstrap/research"]
dbus = ["sven-bootstrap/dbus"]
android = ["sven-bootstrap/android"]

[dev-dependencies]
async-trait     = { workspace = true }
futures         = { workspace = true }
schemars        = { workspace = true }
sven-hsm        = { path = "../hsm" }
sven-model-mock = { path = "../model-mock" }
sven-turn       = { path = "../turn" }
tempfile        = { workspace = true }
