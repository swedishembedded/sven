[workspace]
resolver = "2"
members = [
    ".",
    "crates/hsm",
    "crates/kernel",
    "crates/chain",
    "crates/vocab",
    "crates/config",
    "crates/model",
    "crates/model-catalog",
    "crates/model-mock",
    "crates/model-drivers",
    "crates/image",
    "crates/sven-audio",
    "crates/session-store",
    "crates/session-model",
    "crates/tool-api",
    "crates/tool-registry",
    "crates/tools",
    "crates/turn",
    "crates/machines",
    "crates/workspace",
    "crates/bootstrap",
    # SlashCommand vocabulary + builtins shared by every sven frontend
    "crates/commands",
    "crates/ci",
    "crates/tui",
    "crates/frontend",
    "crates/sven-p2p",
    "crates/sven-node",
    "crates/sven-node-client",
    "crates/mcp",
    "crates/mcp-client",
    "crates/acp",
    "crates/team",
    # New integration crates
    "crates/channels",
    "crates/scheduler",
    "crates/integrations",
    "crates/memory",
    # HSM phase 2 crates
    "crates/llm",
    "crates/executors",
    # Transport-agnostic operator control protocol + kernel mappings
    "crates/control",
    # Cloud tether protocol (control plane <-> companion)
    "crates/wire",
    # Customer-side companion binary (remote hands)
    "crates/companion",
    # Cloud control plane: companion registry + tether routing
    "crates/cloud",
    # Cloud control-plane persistence (Phase 5 split of sven-cloud's `store`).
    "crates/cloud-store",
    # Cloud identity: token minting/authentication/authorisation + companion
    # bearer-token auth (Phase 5 split of sven-cloud's `identity`/`auth`).
    "crates/cloud-identity",
    # Cloud tether routing core: CompanionRegistry (Phase 5 split of
    # sven-cloud's `registry`).
    "crates/cloud-tether",
    # Cloud LLM metering gateway + session gate (Phase 5 split of
    # sven-cloud's `metering`/`gate`).
    "crates/cloud-metering",
    # Cloud human portal, live session feed, Slack/Telegram approval routing,
    # and the cloud session runtime (Phase 5 split of sven-cloud's
    # `portal`/`feed`/`channels`/`runtime`).
    "crates/cloud-portal",
    # LLM metering: pricing catalog, credit ledger, statements
    "crates/metering",
    # ATIF v1.7 trajectory format (standalone; not yet wired into sven)
    "crates/atif",
    # Workspace tooling: `cargo run -p xtask -- arch` enforces architecture.toml
    "xtask",
]

# Single source of truth for the sven release version. The top-level `sven`
# binary crate's `[package]` inherits this (see below), and so does
# `crates/input` — the ATIF trace writer reads `env!("CARGO_PKG_VERSION")`
# there to stamp `Trajectory.agent.version` (see `trace_session::default_agent_profile`).
# Before this existed, `crates/input/Cargo.toml` carried its own frozen
# `version = "1.0.0"`, so every trace this binary wrote claimed agent version
# "1.0.0" instead of the real release version. Inheriting from here keeps the
# two permanently in sync with no runtime plumbing required.
[workspace.package]
version = "1.10.2"

[workspace.dependencies]
libc         = "0.2"
fs4          = "0.13"
walkdir      = "2"
tempfile     = "3"
serde_yaml   = "0.9"
anyhow       = "1"
thiserror    = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait  = "0.1"
futures      = "0.3"
reqwest      = { version = "0.12", features = ["json", "stream", "rustls-tls", "gzip"], default-features = false }
rustls       = { version = "0.23", features = ["ring"] }
html2text    = "0.12"
async-recursion = "1"
clap         = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid         = { version = "1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
dirs         = "5"
humantime    = "2"
regex        = "1"
sha2         = "0.10"
shellexpand  = "3"
hex          = "0.4"
subtle       = "2.6"
lru          = "0.12"
pulldown-cmark = "0.12"
ratatui      = "0.30"
crossterm    = { version = "0.28", features = ["event-stream"] }
syntect      = "5"
unicode-width = { version = "0.2", features = ["cjk"] }
nvim-rs      = { version = "0.9", features = ["use_tokio"] }
rmpv         = "1.3"
image        = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
base64       = "0.22"
similar      = "2"
rmcp         = { version = "0.15", default-features = false }
memmap2      = "0.9"
notify       = "7"

[package]
name    = "sven"
version.workspace = true
edition = "2021"
description = "A CLI and CI AI coding agent"
license = "Apache-2.0"

[[bin]]
name = "sven"
path = "src/main.rs"

[dependencies]
sven-config      = { path = "crates/config" }
sven-model       = { path = "crates/model" }
sven-model-drivers = { path = "crates/model-drivers" }
sven-session-store = { path = "crates/session-store" }
sven-tools       = { path = "crates/tools" }
sven-bootstrap   = { path = "crates/bootstrap" }
sven-ci          = { path = "crates/ci" }
sven-team        = { path = "crates/team" }
sven-tui         = { path = "crates/tui" }
sven-node        = { path = "crates/sven-node" }
sven-p2p         = { path = "crates/sven-p2p" }
sven-node-client = { path = "crates/sven-node-client" }
sven-mcp         = { path = "crates/mcp" }
sven-acp         = { path = "crates/acp" }
# Cloud control plane (`sven cloud` subcommand): tenants, tokens, tether, gating.
sven-cloud       = { path = "crates/cloud" }
# Pricing catalog + credit ledger backing `sven cloud session`'s gate.
sven-metering    = { path = "crates/metering" }
anyhow      = { workspace = true }
humantime   = { workspace = true }
tokio       = { workspace = true }
clap        = { workspace = true }
rustls      = { workspace = true }
clap_complete = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
dirs        = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
serde       = { workspace = true }
reqwest     = { workspace = true }
libc        = { workspace = true }
ratatui     = { workspace = true }
chrono      = { workspace = true }

[dev-dependencies]
serde_json       = { workspace = true }
uuid             = { workspace = true }
sven-bootstrap   = { path = "crates/bootstrap" }
sven-tools       = { path = "crates/tools" }
sven-config      = { path = "crates/config" }
sven-model       = { path = "crates/model" }
sven-channels    = { path = "crates/channels" }
async-trait      = { workspace = true }
tokio            = { workspace = true }
tempfile         = { workspace = true }

# ── Debian package metadata ──────────────────────────────────────────────────
# Used by `cargo deb` (cargo-deb crate) and mirrored by scripts/build-deb.sh.
[package.metadata.deb]
maintainer    = "Sven Team <team@example.com>"
copyright     = "2024 Sven Contributors"
license-file  = ["LICENSE", "0"]
extended-description = """\
Sven is an efficient AI coding agent that works both as an interactive
terminal UI (TUI) and as a headless CI pipeline tool.  It can read
multi-step instructions from Markdown files or stdin, execute tool calls
(shell, filesystem, glob search), and stream clean text to stdout so its
output pipes directly into other agents or CI steps."""
depends       = "$auto"
section       = "utils"
priority      = "optional"
assets = [
    # CLI/TUI binary
    ["target/release/sven", "usr/bin/sven", "755"],
    # Shell completions (generated during the deb build - see Makefile)
    ["target/completions/sven.bash", "usr/share/bash-completion/completions/sven",    "644"],
    ["target/completions/_sven",     "usr/share/zsh/vendor-completions/_sven",        "644"],
    ["target/completions/sven.fish", "usr/share/fish/vendor_completions.d/sven.fish", "644"],
]

[profile.release]
opt-level      = 3
lto            = "thin"   # thin LTO: cross-crate inlining without serializing all codegen to 1 unit
codegen-units  = 8        # match physical core count; fat LTO forces this to 1, killing parallelism
strip          = true

[profile.dev]
opt-level     = 0
codegen-units = 256       # max parallelism for debug builds (cargo default, made explicit)

# Fast CI/check profile: same as dev but skip debug info for faster linking
[profile.ci]
inherits      = "dev"
debug         = 0
